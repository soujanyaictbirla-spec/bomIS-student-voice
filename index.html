<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Student Voice Recorder</title>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startButton {
      background: #2e7d32;
      color: white;
    }

    #stopButton {
      background: #c62828;
      color: white;
    }

    #saveButton {
      background: #1565c0;
      color: white;
    }

    #clearButton {
      background: #777;
      color: white;
    }

    #downloadButton {
      background: #6a1b9a;
      color: white;
    }

    button:disabled {
      background: #ccc !important;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: center;
    }

    .recording {
      color: #c62828;
      font-weight: bold;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .recording-box {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .timer {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>BOMIS Student Voice Recorder</h1>

  <div class="subtitle">
    Audio Recording + Speech to Text
  </div>


  <!-- Student Name -->

  <label>Student Name</label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name">


  <!-- Grade -->

  <label>Grade</label>

  <select id="grade">

    <option value="">Select Grade</option>

    <option value="Grade 1">Grade 1</option>
    <option value="Grade 2">Grade 2</option>
    <option value="Grade 3">Grade 3</option>
    <option value="Grade 4">Grade 4</option>
    <option value="Grade 5">Grade 5</option>
    <option value="Grade 6">Grade 6</option>
    <option value="Grade 7">Grade 7</option>
    <option value="Grade 8">Grade 8</option>
    <option value="Grade 9">Grade 9</option>
    <option value="Grade 10">Grade 10</option>
    <option value="Grade 11">Grade 11</option>
    <option value="Grade 12">Grade 12</option>

  </select>


  <!-- Date -->

  <label>Date</label>

  <input
    type="date"
    id="date">


  <!-- Recording -->

  <div class="recording-box">

    <div class="timer" id="timer">
      00:00
    </div>


    <div class="buttons">

      <button
        id="startButton"
        onclick="startRecording()">

        🎤 Start Recording

      </button>


      <button
        id="stopButton"
        onclick="stopRecording()"
        disabled>

        ⏹ Stop

      </button>

    </div>


    <audio
      id="audioPlayer"
      controls
      style="display:none;">
    </audio>


    <div class="buttons">

      <button
        id="downloadButton"
        onclick="downloadAudio()"
        disabled>

        ⬇️ Download Audio

      </button>

    </div>

  </div>


  <!-- Speech Text -->

  <label>Conversation Text</label>

  <textarea
    id="transcript"
    placeholder="Your speech will appear here..."></textarea>


  <!-- Save / Clear -->

  <div class="buttons">

    <button
      id="saveButton"
      onclick="saveText()">

      💾 Save Text to GSheet

    </button>


    <button
      id="clearButton"
      onclick="clearAll()">

      Clear

    </button>

  </div>


  <div id="status">
    Ready
  </div>


</div>



<script>


// =====================================================
// VARIABLES
// =====================================================

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let recognition = null;

let isListening = false;

let finalTranscript = "";

let timerInterval = null;

let seconds = 0;



// =====================================================
// PAGE LOAD
// =====================================================

window.onload = function() {

  setTodayDate();

  setupSpeechRecognition();

};



// =====================================================
// TODAY'S DATE
// =====================================================

function setTodayDate() {

  const today = new Date();

  const yyyy = today.getFullYear();

  const mm = String(today.getMonth() + 1)
    .padStart(2, "0");

  const dd = String(today.getDate())
    .padStart(2, "0");

  document.getElementById("date").value =
    yyyy + "-" + mm + "-" + dd;

}



// =====================================================
// SPEECH RECOGNITION
// =====================================================

function setupSpeechRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setStatus(
      "Speech-to-text is not supported in this browser.",
      "error"
    );

    return;

  }


  recognition = new SpeechRecognition();

  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.lang = "en-IN";


  recognition.onstart = function() {

    isListening = true;

  };


  recognition.onresult = function(event) {

    let interimTranscript = "";


    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const speech =
        event.results[i][0].transcript;


      if (event.results[i].isFinal) {

        finalTranscript += speech + " ";

      } else {

        interimTranscript += speech;

      }

    }


    document.getElementById("transcript").value =
      finalTranscript + interimTranscript;

  };


  recognition.onerror = function(event) {

    console.log(
      "Speech recognition error:",
      event.error
    );


    if (event.error === "not-allowed") {

      setStatus(
        "Microphone permission denied. Please allow microphone access.",
        "error"
      );

    }

  };


  recognition.onend = function() {

    isListening = false;

  };

}



// =====================================================
// START RECORDING
// =====================================================

async function startRecording() {


  const studentName =
    document.getElementById("studentName")
      .value.trim();


  const grade =
    document.getElementById("grade")
      .value;


  if (!studentName) {

    setStatus(
      "Please enter the student name.",
      "error"
    );

    return;

  }


  if (!grade) {

    setStatus(
      "Please select the grade.",
      "error"
    );

    return;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            { type: "audio/webm" }
          );


        audioUrl =
          URL.createObjectURL(audioBlob);


        const player =
          document.getElementById("audioPlayer");


        player.src = audioUrl;

        player.style.display = "block";


        document.getElementById(
          "downloadButton"
        ).disabled = false;


        setStatus(
          "Recording completed. You can play or download it.",
          "success"
        );


        // Stop microphone
        stream.getTracks().forEach(
          track => track.stop()
        );

      };


    mediaRecorder.start();


    // Start speech recognition
    if (recognition) {

      finalTranscript =
        document.getElementById("transcript")
          .value.trim();


      if (finalTranscript) {

        finalTranscript += " ";

      }


      try {

        recognition.start();

      } catch (e) {

        console.log(e);

      }

    }


    startTimer();


    document.getElementById("startButton")
      .disabled = true;


    document.getElementById("stopButton")
      .disabled = false;


    setStatus(
      "🎤 Recording and converting speech to text...",
      "recording"
    );


  } catch (error) {

    console.error(error);


    setStatus(
      "Microphone access failed. Please allow microphone permission in Chrome.",
      "error"
    );

  }

}



// =====================================================
// STOP RECORDING
// =====================================================

function stopRecording() {


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

  }


  if (recognition && isListening) {

    recognition.stop();

  }


  stopTimer();


  document.getElementById("startButton")
    .disabled = false;


  document.getElementById("stopButton")
    .disabled = true;

}



// =====================================================
// TIMER
// =====================================================

function startTimer() {

  seconds = 0;

  updateTimer();


  timerInterval =
    setInterval(function() {

      seconds++;

      updateTimer();

    }, 1000);

}



function stopTimer() {

  clearInterval(timerInterval);

}



function updateTimer() {

  const minutes =
    Math.floor(seconds / 60);

  const remainingSeconds =
    seconds % 60;


  document.getElementById("timer")
    .textContent =

    String(minutes).padStart(2, "0")
    + ":" +
    String(remainingSeconds).padStart(2, "0");

}



// =====================================================
// DOWNLOAD AUDIO
// =====================================================

function downloadAudio() {


  if (!audioBlob || !audioUrl) {

    setStatus(
      "Please record something first.",
      "error"
    );

    return;

  }


  const studentName =
    document.getElementById("studentName")
      .value.trim();


  const grade =
    document.getElementById("grade")
      .value;


  const date =
    document.getElementById("date")
      .value;


  if (!studentName || !grade) {

    setStatus(
      "Please enter student name and grade first.",
      "error"
    );

    return;

  }


  // Make a safe filename
  const safeStudentName =
    studentName.replace(
      /[^a-zA-Z0-9-_]/g,
      "_"
    );


  const safeGrade =
    grade.replace(
      /[^a-zA-Z0-9-_]/g,
      "_"
    );


  const filename =
    safeStudentName +
    "_" +
    safeGrade +
    "_" +
    date +
    ".webm";


  const link =
    document.createElement("a");


  link.href = audioUrl;

  link.download = filename;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  setStatus(
    "Audio downloaded as " + filename,
    "success"
  );

}



// =====================================================
// SAVE TEXT TO GOOGLE SHEET
// =====================================================

function saveText() {


  const studentName =
    document.getElementById("studentName")
      .value.trim();


  const grade =
    document.getElementById("grade")
      .value;


  const date =
    document.getElementById("date")
      .value;


  const text =
    document.getElementById("transcript")
      .value.trim();


  if (!studentName) {

    setStatus(
      "Please enter the student name.",
      "error"
    );

    return;

  }


  if (!grade) {

    setStatus(
      "Please select the grade.",
      "error"
    );

    return;

  }


  if (!date) {

    setStatus(
      "Please select the date.",
      "error"
    );

    return;

  }


  if (!text) {

    setStatus(
      "There is no text to save.",
      "error"
    );

    return;

  }


  document.getElementById("saveButton")
    .disabled = true;


  setStatus("Saving text to Google Sheet...");


  google.script.run

    .withSuccessHandler(
      function(result) {

        document.getElementById(
          "saveButton"
        ).disabled = false;


        if (result.success) {

          setStatus(
            "✅ " + result.message,
            "success"
          );

        } else {

          setStatus(
            "❌ " + result.message,
            "error"
          );

        }

      }
    )

    .withFailureHandler(
      function(error) {

        document.getElementById(
          "saveButton"
        ).disabled = false;


        setStatus(
          "❌ Save failed: " +
          error.message,
          "error"
        );

      }
    )

    .saveText({

      studentName:
        studentName,

      grade:
        grade,

      date:
        date,

      text:
        text

    });

}



// =====================================================
// CLEAR
// =====================================================

function clearAll() {


  document.getElementById(
    "studentName"
  ).value = "";


  document.getElementById(
    "grade"
  ).value = "";


  document.getElementById(
    "transcript"
  ).value = "";


  finalTranscript = "";


  audioBlob = null;


  if (audioUrl) {

    URL.revokeObjectURL(audioUrl);

  }


  audioUrl = null;


  document.getElementById(
    "audioPlayer"
  ).src = "";


  document.getElementById(
    "audioPlayer"
  ).style.display = "none";


  document.getElementById(
    "downloadButton"
  ).disabled = true;


  document.getElementById(
    "timer"
  ).textContent = "00:00";


  setStatus("Ready");

}



// =====================================================
// STATUS
// =====================================================

function setStatus(message, type) {


  const status =
    document.getElementById("status");


  status.textContent = message;


  status.className = "";


  if (type) {

    status.classList.add(type);

  }

}

</script>


</body>

</html>
