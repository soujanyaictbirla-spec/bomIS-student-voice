<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice Recorder</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  color: #1f4e79;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  height: 180px;
}

.buttons {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

#startBtn {
  background: #198754;
  color: white;
}

#stopBtn {
  background: #dc3545;
  color: white;
}

#saveBtn {
  background: #1f4e79;
  color: white;
}

#downloadBtn {
  background: #6f42c1;
  color: white;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#timer {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin: 20px;
}

#status {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🎙️ BOMIS Student Voice Recorder</h1>

<label>Student Name</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name">


<label>Grade</label>

<select id="grade">

<option value="">Select Grade</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<label>Date</label>

<input
  type="date"
  id="date">


<label>Language</label>

<select id="language">

<option value="English">English</option>
<option value="Telugu">Telugu</option>

</select>


<div id="timer">00:00</div>


<div class="buttons">

<button id="startBtn">
🎙️ Start Recording
</button>

<button id="stopBtn" disabled>
⏹ Stop Recording
</button>

</div>


<label>Conversation Text</label>

<textarea
id="transcript"
placeholder="Your spoken words will appear here..."></textarea>


<div class="buttons">

<button id="downloadBtn" disabled>
⬇️ Download Audio
</button>

<button id="saveBtn">
💾 Save to Google Sheet
</button>

</div>


<div id="status">
Ready
</div>

</div>


<script>

/* =====================================
   APPS SCRIPT URL
===================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyE1juAJGnPJKSfdh41W4K7gpi8k-QUsO_hgmSKI7P7s1ljb48LzEQJT8G4Uw6HRqUL/exec";


/* =====================================
   VARIABLES
===================================== */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let recognition = null;

let finalTranscript = "";

let isRecording = false;

let timerInterval = null;

let startTime = 0;


/* =====================================
   ELEMENTS
===================================== */

const studentName =
document.getElementById("studentName");

const grade =
document.getElementById("grade");

const date =
document.getElementById("date");

const language =
document.getElementById("language");

const transcript =
document.getElementById("transcript");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const saveBtn =
document.getElementById("saveBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const status =
document.getElementById("status");

const timer =
document.getElementById("timer");


/* =====================================
   TODAY'S DATE
===================================== */

date.value =
new Date().toISOString().split("T")[0];


/* =====================================
   START
===================================== */

startBtn.onclick = async function() {

  try {

    if (!studentName.value.trim()) {
      alert("Please enter Student Name.");
      return;
    }

    if (!grade.value) {
      alert("Please select Grade.");
      return;
    }


    /* MICROPHONE */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    /* AUDIO */

    audioChunks = [];

    audioBlob = null;

    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
    function(event) {

      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }

    };


    mediaRecorder.onstop =
    function() {

      audioBlob =
        new Blob(audioChunks, {
          type: "audio/webm"
        });

      downloadBtn.disabled = false;

      stream.getTracks().forEach(
        track => track.stop()
      );

    };


    mediaRecorder.start();


    /* =================================
       SPEECH RECOGNITION
    ================================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      alert(
        "Please use Google Chrome for speech recognition."
      );

      mediaRecorder.stop();

      return;
    }


    recognition =
      new SpeechRecognition();


    recognition.lang =
      language.value === "Telugu"
      ? "te-IN"
      : "en-IN";


    recognition.continuous = true;

    recognition.interimResults = true;


    finalTranscript = "";


    recognition.onresult =
    function(event) {

      let interim = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0].transcript;


        if (event.results[i].isFinal) {

          finalTranscript += text + " ";

        } else {

          interim += text;

        }

      }


      transcript.value =
        finalTranscript + interim;

    };


    recognition.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );

    };


    recognition.onend =
    function() {

      if (isRecording) {

        try {
          recognition.start();
        } catch (e) {}

      }

    };


    recognition.start();


    /* =================================
       TIMER
    ================================= */

    startTime = Date.now();

    timerInterval =
      setInterval(function() {

        const elapsed =
          Math.floor(
            (Date.now() - startTime) / 1000
          );

        const minutes =
          Math.floor(elapsed / 60);

        const seconds =
          elapsed % 60;


        timer.textContent =
          String(minutes).padStart(2,"0")
          + ":" +
          String(seconds).padStart(2,"0");

      }, 1000);


    isRecording = true;

    startBtn.disabled = true;

    stopBtn.disabled = false;

    status.textContent =
      "🔴 Recording...";

  }

  catch(error) {

    console.error(error);

    alert(
      "Microphone error:\n" +
      error.message
    );

  }

};


/* =====================================
   STOP
===================================== */

stopBtn.onclick = function() {

  isRecording = false;


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

  }


  if (recognition) {

    try {
      recognition.stop();
    }
    catch(e) {}

  }


  clearInterval(timerInterval);


  startBtn.disabled = false;

  stopBtn.disabled = true;


  status.textContent =
    "Recording stopped. Please save the text.";

};


/* =====================================
   DOWNLOAD AUDIO
===================================== */

downloadBtn.onclick = function() {

  if (!audioBlob) {

    alert("No audio recording available.");

    return;
  }


  const safeName =
    studentName.value
      .trim()
      .replace(/[^a-zA-Z0-9_-]/g, "_");


  const safeGrade =
    grade.value
      .replace(/\s+/g, "_");


  const fileName =
    safeName +
    "_" +
    safeGrade +
    "_" +
    date.value +
    ".webm";


  const audioURL =
    URL.createObjectURL(audioBlob);


  const link =
    document.createElement("a");


  link.href = audioURL;

  link.download = fileName;


  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  setTimeout(function() {

    URL.revokeObjectURL(audioURL);

  }, 1000);

};


/* =====================================
   SAVE TO GOOGLE SHEET
===================================== */

saveBtn.onclick = function() {

  saveToGoogleSheet();

};


async function saveToGoogleSheet() {

  const name =
    studentName.value.trim();

  const selectedGrade =
    grade.value;

  const selectedDate =
    date.value;

  const selectedLanguage =
    language.value;

  const text =
    transcript.value.trim();


  if (!name) {

    alert("Please enter Student Name.");

    return;
  }


  if (!selectedGrade) {

    alert("Please select Grade.");

    return;
  }


  if (!text) {

    alert("No conversation text found.");

    return;
  }


  const data = {

    studentName: name,

    grade: selectedGrade,

    date: selectedDate,

    language: selectedLanguage,

    text: text

  };


  status.textContent =
    "⏳ Saving to Google Sheet...";


  try {

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)
      }
    );


    status.textContent =
      "✅ Sent to Google Sheet.";

  }

  catch(error) {

    console.error(error);

    status.textContent =
      "❌ Save failed.";

    alert(
      "Could not save:\n" +
      error.message
    );

  }

}

</script>

</body>
</html>
