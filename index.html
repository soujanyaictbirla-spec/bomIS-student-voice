<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
  text-align: center;
  color: #1a4d8f;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
textarea {

  width: 100%;
  padding: 12px;
  margin-top: 5px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;

}

textarea {

  height: 180px;

}

button {

  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;

}

#startBtn {

  background: #198754;
  color: white;

}

#stopBtn {

  background: #dc3545;
  color: white;

}

#saveBtn {

  background: #1a4d8f;
  color: white;

}

button:disabled {

  background: #aaa !important;
  cursor: not-allowed;

}

#status,
#audioStatus {

  text-align: center;
  margin-top: 15px;
  font-weight: bold;

}

#clock {

  text-align: center;
  margin-top: 10px;
  font-size: 18px;

}

audio {

  width: 100%;
  margin-top: 15px;

}

.success {

  color: green;

}

.error {

  color: red;

}

.audio-link {

  display: inline-block;
  margin-top: 10px;
  padding: 10px 15px;
  background: #198754;
  color: white;
  text-decoration: none;
  border-radius: 7px;

}

</style>

</head>


<body>


<div class="container">


<h1>🎤 BOMIS Student Voice</h1>


<!-- STUDENT NAME -->

<label>Student Name</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name">


<!-- GRADE -->

<label>Grade</label>

<select id="grade">

<option value="">Select Grade</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<!-- SECTION -->

<label>Section</label>

<select id="section">

<option value="">Select Section</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>

</select>


<!-- LANGUAGE -->

<label>Language</label>

<select id="language">

<option value="en-IN">English</option>

<option value="te-IN">Telugu</option>

</select>


<!-- CLOCK -->

<div id="clock"></div>


<!-- START -->

<button
  id="startBtn"
  onclick="startRecording()">

🎤 START SPEAKING

</button>


<!-- STOP -->

<button
  id="stopBtn"
  onclick="stopRecording()"
  disabled>

⏹ STOP

</button>


<!-- AUDIO STATUS -->

<div id="audioStatus">

🔊 Audio not recorded

</div>


<!-- AUDIO PREVIEW -->

<audio
  id="audioPreview"
  controls
  style="display:none">

</audio>


<!-- TEXT -->

<label>Converted Text</label>

<textarea
  id="speechText"
  placeholder="Your speech will appear here...">
</textarea>


<!-- SAVE -->

<button
  id="saveBtn"
  onclick="saveRecord()"
  disabled>

💾 SAVE RECORD

</button>


<!-- STATUS -->

<div id="status"></div>


</div>


<script>


// =====================================================
// APPS SCRIPT URL
// =====================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbydLI89-T813TieNgUCGBji3bAbjW-zZzLJrdBgsz-ZIsVzHgebtVtpKakxEiG1ZLU8/exec";


// =====================================================
// VARIABLES
// =====================================================

let recognition = null;

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let microphoneStream = null;

let finalText = "";

let recordingFinished = false;

let selectedMimeType = "audio/webm";


// =====================================================
// SPEECH RECOGNITION
// =====================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous = true;

  recognition.interimResults = true;


  recognition.onresult =
    function(event) {

      let interimText = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            transcript + " ";

        } else {

          interimText += transcript;

        }

      }


      document.getElementById(
        "speechText"
      ).value =
        finalText + interimText;

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech recognition error:",
        event.error
      );

    };


  recognition.onend =
    function() {

      console.log(
        "Speech recognition ended"
      );

    };

}


// =====================================================
// CLOCK
// =====================================================

function updateClock() {

  document.getElementById(
    "clock"
  ).innerText =
    "Time: " +
    new Date().toLocaleTimeString();

}


setInterval(
  updateClock,
  1000
);

updateClock();


// =====================================================
// START RECORDING
// =====================================================

async function startRecording() {

  try {


    // RESET AUDIO

    audioBlob = null;

    audioChunks = [];

    recordingFinished = false;


    document.getElementById(
      "saveBtn"
    ).disabled = true;


    document.getElementById(
      "startBtn"
    ).disabled = true;


    document.getElementById(
      "stopBtn"
    ).disabled = false;


    // -----------------------------------------------
    // GET MICROPHONE
    // -----------------------------------------------

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    // -----------------------------------------------
    // SELECT AUDIO FORMAT
    // -----------------------------------------------

    selectedMimeType =
      "audio/webm";


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      selectedMimeType =
        "audio/webm;codecs=opus";

    }
    else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      selectedMimeType =
        "audio/webm";

    }
    else if (
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ) {

      selectedMimeType =
        "audio/mp4";

    }


    console.log(
      "Audio format:",
      selectedMimeType
    );


    // -----------------------------------------------
    // CREATE MEDIA RECORDER
    // -----------------------------------------------

    mediaRecorder =
      new MediaRecorder(
        microphoneStream,
        {
          mimeType:
            selectedMimeType
        }
      );


    // -----------------------------------------------
    // AUDIO DATA
    // -----------------------------------------------

    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    // -----------------------------------------------
    // RECORDING STOPPED
    // -----------------------------------------------

    mediaRecorder.onstop =
      function() {


        console.log(
          "MediaRecorder stopped"
        );


        // CREATE AUDIO BLOB

        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                selectedMimeType
            }
          );


        console.log(
          "Audio size:",
          audioBlob.size
        );


        if (
          audioBlob.size === 0
        ) {

          document.getElementById(
            "audioStatus"
          ).innerText =
            "❌ Audio recording is empty.";

          document.getElementById(
            "saveBtn"
          ).disabled = true;

          return;

        }


        recordingFinished = true;


        // -------------------------------------------
        // AUDIO PREVIEW
        // -------------------------------------------

        const audioUrl =
          URL.createObjectURL(
            audioBlob
          );


        const preview =
          document.getElementById(
            "audioPreview"
          );


        preview.src =
          audioUrl;


        preview.style.display =
          "block";


        // -------------------------------------------
        // STATUS
        // -------------------------------------------

        document.getElementById(
          "audioStatus"
        ).innerText =
          "✅ Audio recording completed";


        document.getElementById(
          "saveBtn"
        ).disabled = false;


        document.getElementById(
          "startBtn"
        ).disabled = false;


        document.getElementById(
          "stopBtn"
        ).disabled = true;


        // -------------------------------------------
        // RELEASE MICROPHONE
        // -------------------------------------------

        if (
          microphoneStream
        ) {

          microphoneStream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }

      };


    // -----------------------------------------------
    // START AUDIO
    // -----------------------------------------------

    mediaRecorder.start(
      1000
    );


    // -----------------------------------------------
    // SPEECH TEXT
    // -----------------------------------------------

    finalText =
      document.getElementById(
        "speechText"
      ).value;


    const selectedLanguage =
      document.getElementById(
        "language"
      ).value;


    if (recognition) {

      recognition.lang =
        selectedLanguage;


      try {

        recognition.start();

      }
      catch (error) {

        console.log(
          "Recognition start:",
          error
        );

      }

    }


    // -----------------------------------------------
    // STATUS
    // -----------------------------------------------

    document.getElementById(
      "audioStatus"
    ).innerText =
      "🔴 Recording audio...";


    document.getElementById(
      "status"
    ).innerText =
      "🎤 Listening... Speak now.";

  }


  catch (error) {


    console.error(
      "Microphone error:",
      error
    );


    document.getElementById(
      "status"
    ).innerText =
      "❌ Microphone error: " +
      error.message;


    document.getElementById(
      "startBtn"
    ).disabled = false;


    document.getElementById(
      "stopBtn"
    ).disabled = true;

  }

}


// =====================================================
// STOP RECORDING
// =====================================================

function stopRecording() {


  // STOP SPEECH

  if (recognition) {

    try {

      recognition.stop();

    }
    catch (error) {

      console.log(error);

    }

  }


  // STOP AUDIO

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    document.getElementById(
      "audioStatus"
    ).innerText =
      "⏳ Finishing audio recording...";


    mediaRecorder.stop();

  }

}


// =====================================================
// CONVERT BLOB TO BASE64
// =====================================================

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {


      const reader =
        new FileReader();


      reader.onload =
        function() {

          try {

            const result =
              reader.result;


            const base64 =
              result.split(",")[1];


            if (!base64) {

              reject(
                new Error(
                  "Could not convert audio to Base64."
                )
              );

              return;

            }


            resolve(base64);

          }
          catch (error) {

            reject(error);

          }

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read audio file."
            )
          );

        };


      reader.readAsDataURL(blob);

    }
  );

}


// =====================================================
// SAVE RECORD
// =====================================================

async function saveRecord() {


  // -----------------------------------------------
  // CHECK AUDIO
  // -----------------------------------------------

  if (
    !recordingFinished ||
    !audioBlob
  ) {

    alert(
      "Please stop the recording first."
    );

    return;

  }


  // -----------------------------------------------
  // GET FORM DATA
  // -----------------------------------------------

  const name =
    document.getElementById(
      "studentName"
    ).value.trim();


  const grade =
    document.getElementById(
      "grade"
    ).value;


  const section =
    document.getElementById(
      "section"
    ).value;


  const languageSelect =
    document.getElementById(
      "language"
    );


  const language =
    languageSelect.options[
      languageSelect.selectedIndex
    ].text;


  const text =
    document.getElementById(
      "speechText"
    ).value.trim();


  // -----------------------------------------------
  // VALIDATION
  // -----------------------------------------------

  if (
    !name ||
    !grade ||
    !section ||
    !text
  ) {

    alert(
      "Please enter Student Name, Grade, Section and Speech Text."
    );

    return;

  }


  // -----------------------------------------------
  // DISABLE SAVE
  // -----------------------------------------------

  document.getElementById(
    "saveBtn"
  ).disabled = true;


  document.getElementById(
    "status"
  ).innerText =
    "⏳ Preparing audio...";


  try {


    // ---------------------------------------------
    // CONVERT AUDIO
    // ---------------------------------------------

    const base64 =
      await blobToBase64(
        audioBlob
      );


    console.log(
      "Base64 length:",
      base64.length
    );


    // ---------------------------------------------
    // CREATE PAYLOAD
    // ---------------------------------------------

    const payload = {

      name:
        name,

      grade:
        grade,

      section:
        section,

      language:
        language,

      text:
        text,

      audioBase64:
        base64,

      audioMimeType:
        selectedMimeType

    };


    console.log(
      "Sending payload..."
    );


    document.getElementById(
      "status"
    ).innerText =
      "⏳ Uploading audio to Google Drive...";


    // ---------------------------------------------
    // SEND TO APPS SCRIPT
    // ---------------------------------------------

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {
          method:
            "POST",

          body:
            JSON.stringify(
              payload
            )
        }
      );


    console.log(
      "Response status:",
      response.status
    );


    // ---------------------------------------------
    // READ RESPONSE
    // ---------------------------------------------

    const responseText =
      await response.text();


    console.log(
      "Apps Script response:",
      responseText
    );


    let result;


    try {

      result =
        JSON.parse(
          responseText
        );

    }
    catch (error) {

      throw new Error(
        "Apps Script returned an invalid response."
      );

    }


    // ---------------------------------------------
    // SUCCESS
    // ---------------------------------------------

    if (
      result.success
    ) {


      document.getElementById(
        "status"
      ).innerHTML =
        '<div class="success">' +
        '✅ RECORD SAVED SUCCESSFULLY!' +
        '<br><br>' +
        '📁 File: ' +
        result.fileName +
        '</div>';


      // -------------------------------------------
      // DRIVE LINK
      // -------------------------------------------

      if (
        result.audioUrl
      ) {

        document.getElementById(
          "status"
        ).innerHTML +=

          '<br>' +

          '<a class="audio-link" ' +

          'href="' +
          result.audioUrl +
          '" ' +

          'target="_blank">' +

          '🔊 OPEN AUDIO FILE' +

          '</a>';

      }


      // -------------------------------------------
      // RESET FORM
      // -------------------------------------------

      document.getElementById(
        "studentName"
      ).value = "";


      document.getElementById(
        "grade"
      ).value = "";


      document.getElementById(
        "section"
      ).value = "";


      document.getElementById(
        "speechText"
      ).value = "";


      document.getElementById(
        "audioPreview"
      ).style.display =
        "none";


      document.getElementById(
        "audioStatus"
      ).innerText =
        "🔊 Audio saved to Drive";


      audioBlob = null;

      audioChunks = [];

      recordingFinished = false;


    }


    else {


      throw new Error(
        result.message ||
        "Upload failed."
      );

    }


  }


  catch (error) {


    console.error(
      "Upload error:",
      error
    );


    document.getElementById(
      "status"
    ).innerHTML =
      '<div class="error">' +
      '❌ UPLOAD FAILED<br>' +
      error.message +
      '</div>';


    document.getElementById(
      "saveBtn"
    ).disabled = false;

  }

}

</script>


</body>

</html>
