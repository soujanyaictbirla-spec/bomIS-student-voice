<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
  text-align: center;
  color: #1a4d8f;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  height: 180px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#startBtn {
  background: #198754;
  color: white;
}

#stopBtn {
  background: #dc3545;
  color: white;
}

#saveBtn {
  background: #1a4d8f;
  color: white;
}

#saveBtn:disabled,
#stopBtn:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#status,
#audioStatus {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

#clock {
  text-align: center;
  margin-top: 10px;
  font-size: 18px;
}

audio {
  width: 100%;
  margin-top: 15px;
}

</style>

</head>

<body>

<div class="container">

<h1>BOMIS Student Voice</h1>

<label>Student Name</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name">


<label>Grade</label>

<select id="grade">

<option value="">Select Grade</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<label>Section</label>

<select id="section">

<option value="">Select Section</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>

</select>


<label>Language</label>

<select id="language">

<option value="en-IN">English</option>

<option value="te-IN">Telugu</option>

</select>


<div id="clock"></div>


<button
  id="startBtn"
  onclick="startRecording()">

🎤 START SPEAKING

</button>


<button
  id="stopBtn"
  onclick="stopRecording()"
  disabled>

⏹ STOP

</button>


<div id="audioStatus">

🔊 Audio not recorded

</div>


<audio
  id="audioPreview"
  controls
  style="display:none">

</audio>


<label>Converted Text</label>

<textarea
  id="speechText"
  placeholder="Your speech will appear here...">
</textarea>


<button
  id="saveBtn"
  onclick="saveRecord()"
  disabled>

💾 SAVE RECORD

</button>


<div id="status"></div>

</div>


<script>


// ==========================================
// APPS SCRIPT URL
// ==========================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbydLI89-T813TieNgUCGBji3bAbjW-zZzLJrdBgsz-ZIsVzHgebtVtpKakxEiG1ZLU8/exec";


// ==========================================
// VARIABLES
// ==========================================

let recognition = null;

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let microphoneStream = null;

let finalText = "";

let recordingFinished = false;


// ==========================================
// CLOCK
// ==========================================

function updateClock() {

  document.getElementById("clock").innerText =
    "Time: " + new Date().toLocaleTimeString();

}

setInterval(updateClock, 1000);

updateClock();


// ==========================================
// SPEECH RECOGNITION
// ==========================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous = true;

  recognition.interimResults = true;


  recognition.onresult =
    function(event) {

      let interimText = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;

        if (event.results[i].isFinal) {

          finalText += transcript + " ";

        } else {

          interimText += transcript;

        }

      }

      document.getElementById(
        "speechText"
      ).value =
        finalText + interimText;

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );

    };

}


// ==========================================
// START RECORDING
// ==========================================

async function startRecording() {

  try {

    audioBlob = null;

    audioChunks = [];

    recordingFinished = false;

    document.getElementById(
      "saveBtn"
    ).disabled = true;

    document.getElementById(
      "stopBtn"
    ).disabled = false;

    document.getElementById(
      "startBtn"
    ).disabled = true;


    // Get microphone

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    // ======================================
    // AUDIO RECORDER
    // ======================================

    let mimeType = "audio/webm";

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        microphoneStream,
        {
          mimeType: mimeType
        }
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            {
              type: mimeType
            }
          );


        recordingFinished = true;


        // Preview

        const audioUrl =
          URL.createObjectURL(
            audioBlob
          );

        const preview =
          document.getElementById(
            "audioPreview"
          );

        preview.src = audioUrl;

        preview.style.display = "block";


        document.getElementById(
          "audioStatus"
        ).innerText =
          "✅ Audio recording completed";


        document.getElementById(
          "saveBtn"
        ).disabled = false;


        document.getElementById(
          "startBtn"
        ).disabled = false;


        document.getElementById(
          "stopBtn"
        ).disabled = true;


        // Release microphone

        if (microphoneStream) {

          microphoneStream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }

      };


    mediaRecorder.start();


    // ======================================
    // SPEECH RECOGNITION
    // ======================================

    const selectedLanguage =
      document.getElementById(
        "language"
      ).value;


    finalText =
      document.getElementById(
        "speechText"
      ).value;


    if (recognition) {

      recognition.lang =
        selectedLanguage;

      recognition.start();

    }


    document.getElementById(
      "audioStatus"
    ).innerText =
      "🔴 Recording audio...";


    document.getElementById(
      "status"
    ).innerText =
      "🎤 Listening...";


  }

  catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).innerText =
      "❌ Microphone error: " +
      error.message;

    document.getElementById(
      "startBtn"
    ).disabled = false;

    document.getElementById(
      "stopBtn"
    ).disabled = true;

  }

}


// ==========================================
// STOP RECORDING
// ==========================================

function stopRecording() {


  if (recognition) {

    try {

      recognition.stop();

    }

    catch (e) {

      console.log(e);

    }

  }


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    document.getElementById(
      "audioStatus"
    ).innerText =
      "⏳ Finishing audio recording...";

    mediaRecorder.stop();

  }

}


// ==========================================
// CONVERT BLOB TO BASE64
// ==========================================

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function() {

          const result =
            reader.result;

          const base64 =
            result.split(",")[1];

          resolve(base64);

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(blob);

    }
  );

}


// ==========================================
// SAVE RECORD
// ==========================================

async function saveRecord() {

  if (!recordingFinished || !audioBlob) {

    alert(
      "Please stop the recording and wait until 'Audio recording completed' appears."
    );

    return;

  }


  const name =
    document.getElementById(
      "studentName"
    ).value.trim();


  const grade =
    document.getElementById(
      "grade"
    ).value;


  const section =
    document.getElementById(
      "section"
    ).value;


  const languageSelect =
    document.getElementById(
      "language"
    );


  const language =
    languageSelect.options[
      languageSelect.selectedIndex
    ].text;


  const text =
    document.getElementById(
      "speechText"
    ).value.trim();


  if (!name || !grade || !section || !text) {

    alert(
      "Please enter Student Name, Grade, Section and Speech Text."
    );

    return;

  }


  document.getElementById(
    "saveBtn"
  ).disabled = true;


  document.getElementById(
    "status"
  ).innerText =
    "⏳ Preparing audio...";


  try {

    const base64 =
      await blobToBase64(
        audioBlob
      );


    document.getElementById(
      "status"
    ).innerText =
      "⏳ Uploading audio to Google Drive...";


    const payload = {

      name: name,

      grade: grade,

      section: section,

      language: language,

      text: text,

      audioBase64: base64,

      audioMimeType:
        audioBlob.type || "audio/webm"

    };


    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {
          method: "POST",
          body: JSON.stringify(payload)
        }
      );


    const result =
      await response.json();


    console.log(
      "Apps Script response:",
      result
    );


    if (result.success) {

      document.getElementById(
        "status"
      ).innerHTML =
        "✅ SUCCESS! Audio saved to Google Drive.";

      document.getElementById(
        "audioStatus"
      ).innerText =
        "✅ Audio uploaded successfully";


      // Show the Drive link

      if (result.audioUrl) {

        document.getElementById(
          "status"
        ).innerHTML +=
          '<br><br><a href="' +
          result.audioUrl +
          '" target="_blank">🔊 OPEN AUDIO FILE</a>';

      }


      // Clear form

      document.getElementById(
        "studentName"
      ).value = "";

      document.getElementById(
        "grade"
      ).value = "";

      document.getElementById(
        "section"
      ).value = "";

      document.getElementById(
        "speechText"
      ).value = "";

      audioBlob = null;

      audioChunks = [];

      recordingFinished = false;

      document.getElementById(
        "audioPreview"
      ).style.display = "none";


    } else {

      throw new Error(
        result.message
      );

    }

  }

  catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).innerText =
      "❌ Upload failed: " +
      error.message;

    document.getElementById(
      "saveBtn"
    ).disabled = false;

  }

}

</script>

</body>

</html>
