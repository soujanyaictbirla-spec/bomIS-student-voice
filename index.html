<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice Recorder</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        margin: 0;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin: 8px 0 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: white;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #startBtn {
        background: #28a745;
        color: white;
    }

    #stopBtn {
        background: #dc3545;
        color: white;
    }

    #downloadBtn {
        width: 100%;
        margin-top: 15px;
        background: #007bff;
        color: white;
        display: none;
    }

    #newStudentBtn {
        width: 100%;
        margin-top: 10px;
        background: #6f42c1;
        color: white;
        display: none;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        margin-top: 20px;
        padding: 15px;
        background: #f1f3f5;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    }

    .recording {
        color: red;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0.4;
        }
    }

    .student-info {
        margin-top: 15px;
        padding: 12px;
        background: #eef4ff;
        border-radius: 8px;
        display: none;
        text-align: center;
    }

    .text-box {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        min-height: 120px;
        line-height: 1.6;
    }

    #transcript {
        margin-top: 10px;
        font-size: 17px;
    }

    audio {
        width: 100%;
        margin-top: 15px;
        display: none;
    }

    .sheet-status {
        margin-top: 10px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
    }

    .success {
        color: #198754;
    }

    .error {
        color: #dc3545;
    }
</style>

</head>

<body>

<div class="container">

    <h1>🎙️ BOMIS Student Voice Recorder</h1>

    <div class="subtitle">
        Speech Recording & Speech-to-Text
    </div>


    <!-- STUDENT NAME -->

    <label for="studentName">
        Student Name
    </label>

    <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
    >


    <!-- GRADE -->

    <label for="grade">
        Grade
    </label>

    <select id="grade">

        <option value="">
            Select Grade
        </option>

        <option>Grade 1</option>
        <option>Grade 2</option>
        <option>Grade 3</option>
        <option>Grade 4</option>
        <option>Grade 5</option>
        <option>Grade 6</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>

    </select>


    <!-- SECTION -->

    <label for="section">
        Section
    </label>

    <select id="section">

        <option value="">
            Select Section
        </option>

        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
        <option>F</option>

    </select>


    <!-- LANGUAGE -->

    <label for="language">
        Language
    </label>

    <select id="language">

        <option value="en-IN">
            English
        </option>

        <option value="te-IN">
            Telugu
        </option>

    </select>


    <!-- BUTTONS -->

    <div class="buttons">

        <button id="startBtn">
            🎙️ Start Recording
        </button>

        <button id="stopBtn" disabled>
            ⏹ Stop
        </button>

    </div>


    <!-- STATUS -->

    <div id="status" class="status">
        Ready to record
    </div>


    <!-- STUDENT INFO -->

    <div
        id="studentInfo"
        class="student-info">
    </div>


    <!-- SPEECH TEXT -->

    <div class="text-box">

        <strong>
            📝 Speech-to-Text
        </strong>

        <div id="transcript">
            Your spoken words will appear here...
        </div>

    </div>


    <!-- AUDIO PLAYER -->

    <audio
        id="audioPlayer"
        controls>
    </audio>


    <!-- SHEET STATUS -->

    <div
        id="sheetStatus"
        class="sheet-status">
    </div>


    <!-- DOWNLOAD -->

    <button id="downloadBtn">
        ⬇️ Download Audio
    </button>


    <!-- NEW STUDENT -->

    <button id="newStudentBtn">
        👩‍🎓 New Student
    </button>

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================
//
// Paste your Apps Script Web App URL here.
//
// Example:
//
// const APPS_SCRIPT_URL =
// "https://script.google.com/macros/s/XXXXXXXX/exec";
//
// =====================================================

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxrbYicdqGs5kQ1xGC4FF3UICAL5_Co4OP2JdmOzGRychzi7oKjJFBh3tUUKeAC0pPy/exec";


// =====================================================
// VARIABLES
// =====================================================

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let recognition = null;

let finalTranscript = "";

let isRecording = false;


// =====================================================
// GET ELEMENTS
// =====================================================

const studentName =
    document.getElementById("studentName");

const grade =
    document.getElementById("grade");

const section =
    document.getElementById("section");

const language =
    document.getElementById("language");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const status =
    document.getElementById("status");

const transcript =
    document.getElementById("transcript");

const audioPlayer =
    document.getElementById("audioPlayer");

const downloadBtn =
    document.getElementById("downloadBtn");

const newStudentBtn =
    document.getElementById("newStudentBtn");

const studentInfo =
    document.getElementById("studentInfo");

const sheetStatus =
    document.getElementById("sheetStatus");


// =====================================================
// START RECORDING
// =====================================================

startBtn.addEventListener(
    "click",
    async function() {

        const name =
            studentName.value.trim();

        const selectedGrade =
            grade.value;

        const selectedSection =
            section.value;

        const selectedLanguage =
            language.value;


        // -------------------------------
        // VALIDATION
        // -------------------------------

        if (!name) {

            alert(
                "Please enter Student Name."
            );

            studentName.focus();

            return;
        }


        if (!selectedGrade) {

            alert(
                "Please select Grade."
            );

            grade.focus();

            return;
        }


        if (!selectedSection) {

            alert(
                "Please select Section."
            );

            section.focus();

            return;
        }


        // -------------------------------
        // RESET
        // -------------------------------

        audioChunks = [];

        finalTranscript = "";

        transcript.innerHTML = "";

        sheetStatus.innerHTML = "";

        downloadBtn.style.display =
            "none";

        newStudentBtn.style.display =
            "none";


        try {

            // -------------------------------
            // MICROPHONE
            // -------------------------------

            const stream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });


            // -------------------------------
            // AUDIO FORMAT
            // -------------------------------

            let options = {};


            if (
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ) {

                options = {
                    mimeType:
                        "audio/webm;codecs=opus"
                };

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/webm"
                )
            ) {

                options = {
                    mimeType:
                        "audio/webm"
                };

            }


            // -------------------------------
            // MEDIA RECORDER
            // -------------------------------

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    options
                );


            mediaRecorder.ondataavailable =
                function(event) {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                };


            // -------------------------------
            // WHEN RECORDING STOPS
            // -------------------------------

            mediaRecorder.onstop =
                async function() {

                    audioBlob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );


                    // -------------------------------
                    // AUDIO PLAYER
                    // -------------------------------

                    audioUrl =
                        URL.createObjectURL(
                            audioBlob
                        );


                    audioPlayer.src =
                        audioUrl;

                    audioPlayer.style.display =
                        "block";


                    // -------------------------------
                    // FILE NAME
                    // -------------------------------

                    const safeName =
                        name.replace(
                            /[^a-zA-Z0-9-_ ]/g,
                            "_"
                        );


                    const safeGrade =
                        selectedGrade.replace(
                            /[^a-zA-Z0-9-_ ]/g,
                            "_"
                        );


                    const safeSection =
                        selectedSection.replace(
                            /[^a-zA-Z0-9-_ ]/g,
                            "_"
                        );


                    const now =
                        new Date();


                    const timestamp =
                        now.getFullYear() +
                        "-" +
                        String(
                            now.getMonth() + 1
                        ).padStart(2, "0") +
                        "-" +
                        String(
                            now.getDate()
                        ).padStart(2, "0") +
                        "_" +
                        String(
                            now.getHours()
                        ).padStart(2, "0") +
                        "-" +
                        String(
                            now.getMinutes()
                        ).padStart(2, "0") +
                        "-" +
                        String(
                            now.getSeconds()
                        ).padStart(2, "0");


                    const fileName =
                        safeName +
                        "_" +
                        safeGrade +
                        "_" +
                        safeSection +
                        "_" +
                        timestamp +
                        ".webm";


                    // -------------------------------
                    // DOWNLOAD BUTTON
                    // -------------------------------

                    downloadBtn.style.display =
                        "block";


                    downloadBtn.onclick =
                        function() {

                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.href =
                                audioUrl;


                            link.download =
                                fileName;


                            document.body.appendChild(
                                link
                            );


                            link.click();


                            document.body.removeChild(
                                link
                            );


                            status.innerHTML =
                                "✅ Audio downloaded";


                        };


                    // -------------------------------
                    // SAVE TEXT TO GOOGLE SHEET
                    // -------------------------------

                    await saveTextToSheet(
                        name,
                        selectedGrade,
                        selectedSection,
                        selectedLanguage,
                        finalTranscript.trim()
                    );


                    // -------------------------------
                    // NEW STUDENT
                    // -------------------------------

                    newStudentBtn.style.display =
                        "block";


                    status.innerHTML =
                        "✅ Recording completed";


                    status.classList.remove(
                        "recording"
                    );

                };


            // -------------------------------
            // START RECORDER
            // -------------------------------

            mediaRecorder.start();


            isRecording = true;


            startBtn.disabled =
                true;


            stopBtn.disabled =
                false;


            status.innerHTML =
                "🔴 Recording... Speak now";


            status.classList.add(
                "recording"
            );


            studentInfo.style.display =
                "block";


            studentInfo.innerHTML =
                "<strong>" +
                name +
                "</strong> &nbsp; | &nbsp; " +
                selectedGrade +
                " &nbsp; | &nbsp; Section " +
                selectedSection;


            // -------------------------------
            // SPEECH RECOGNITION
            // -------------------------------

            startSpeechRecognition(
                selectedLanguage
            );

        }

        catch(error) {

            console.error(error);

            alert(
                "Microphone could not be accessed.\n\n" +
                "Please allow microphone permission in Chrome."
            );

        }

    }
);


// =====================================================
// STOP RECORDING
// =====================================================

stopBtn.addEventListener(
    "click",
    function() {

        if (
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ) {

            mediaRecorder.stop();

        }


        if (recognition) {

            try {

                recognition.stop();

            }

            catch(error) {

                console.log(error);

            }

        }


        isRecording = false;


        startBtn.disabled =
            false;


        stopBtn.disabled =
            true;

    }
);


// =====================================================
// SPEECH RECOGNITION
// =====================================================

function startSpeechRecognition(
    selectedLanguage
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        transcript.innerHTML =
            "Speech-to-text is not supported in this browser.";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.lang =
        selectedLanguage;


    finalTranscript = "";


    // -------------------------------
    // RESULT
    // -------------------------------

    recognition.onresult =
        function(event) {

            let interimTranscript =
                "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const spoken =
                    event.results[i][0]
                    .transcript;


                if (
                    event.results[i]
                    .isFinal
                ) {

                    finalTranscript +=
                        spoken + " ";

                }

                else {

                    interimTranscript +=
                        spoken;

                }

            }


            transcript.innerHTML =
                finalTranscript +
                "<span style='color:#888'>" +
                interimTranscript +
                "</span>";

        };


    // -------------------------------
    // ERROR
    // -------------------------------

    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );

        };


    // -------------------------------
    // RESTART IF BROWSER STOPS
    // -------------------------------

    recognition.onend =
        function() {

            if (isRecording) {

                try {

                    recognition.start();

                }

                catch(error) {

                    console.log(error);

                }

            }

        };


    // -------------------------------
    // START
    // -------------------------------

    try {

        recognition.start();

    }

    catch(error) {

        console.log(error);

    }

}


// =====================================================
// SAVE TEXT TO GOOGLE SHEET
// =====================================================

async function saveTextToSheet(
    name,
    selectedGrade,
    selectedSection,
    selectedLanguage,
    spokenText
) {

    sheetStatus.innerHTML =
        "⏳ Saving text to Google Sheet...";


    sheetStatus.className =
        "sheet-status";


    // Check URL

    if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        sheetStatus.innerHTML =
            "⚠️ Apps Script URL not added. Text was not saved.";

        sheetStatus.className =
            "sheet-status error";

        return;

    }


    try {

        // URL parameters

        const params =
            new URLSearchParams();


        params.append(
            "name",
            name
        );


        params.append(
            "grade",
            selectedGrade
        );


        params.append(
            "section",
            selectedSection
        );


        params.append(
            "language",
            selectedLanguage ===
            "te-IN"
                ? "Telugu"
                : "English"
        );


        params.append(
            "text",
            spokenText
        );


        // -------------------------------
        // SEND TO APPS SCRIPT
        // -------------------------------

        const response =
            await fetch(
                APPS_SCRIPT_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded;charset=UTF-8"
                    },

                    body:
                        params.toString()
                }
            );


        const result =
            await response.text();


        console.log(
            "Google Sheet response:",
            result
        );


        if (
            result.includes("SUCCESS")
        ) {

            sheetStatus.innerHTML =
                "✅ Text saved to Google Sheet";

            sheetStatus.className =
                "sheet-status success";

        }

        else {

            sheetStatus.innerHTML =
                "⚠️ Sheet response: " +
                result;

            sheetStatus.className =
                "sheet-status error";

        }

    }

    catch(error) {

        console.error(error);

        sheetStatus.innerHTML =
            "❌ Could not save text to Google Sheet";

        sheetStatus.className =
            "sheet-status error";

    }

}


// =====================================================
// NEW STUDENT
// =====================================================

newStudentBtn.addEventListener(
    "click",
    function() {

        // Stop recognition

        if (recognition) {

            try {

                recognition.stop();

            }

            catch(error) {}

        }


        // Clear fields

        studentName.value =
            "";

        grade.value =
            "";

        section.value =
            "";

        language.value =
            "en-IN";


        // Clear transcript

        transcript.innerHTML =
            "Your spoken words will appear here...";


        // Hide student info

        studentInfo.style.display =
            "none";


        // Hide audio

        audioPlayer.pause();

        audioPlayer.src = "";

        audioPlayer.style.display =
            "none";


        // Hide buttons

        downloadBtn.style.display =
            "none";

        newStudentBtn.style.display =
            "none";


        // Clear sheet status

        sheetStatus.innerHTML =
            "";

        sheetStatus.className =
            "sheet-status";


        // Reset status

        status.innerHTML =
            "Ready for next student";

        status.classList.remove(
            "recording"
        );


        // Reset variables

        audioChunks = [];

        audioBlob = null;


        if (audioUrl) {

            URL.revokeObjectURL(
                audioUrl
            );

        }

        audioUrl = null;

        finalTranscript = "";

        isRecording = false;


        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;


        // Focus student name

        studentName.focus();

    }
);

</script>

</body>
</html>
