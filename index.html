<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Student Voice Recorder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1f4e79;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 180px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #saveBtn {
      background: #1f4e79;
      color: white;
    }

    #downloadBtn {
      background: #6f42c1;
      color: white;
    }

    button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 20px;
      color: #333;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .note {
      background: #eef5ff;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎙️ BOMIS Student Voice Recorder</h1>

  <label>Student Name</label>
  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >

  <label>Grade</label>
  <select id="grade">
    <option value="">Select Grade</option>
    <option>Grade 1</option>
    <option>Grade 2</option>
    <option>Grade 3</option>
    <option>Grade 4</option>
    <option>Grade 5</option>
    <option>Grade 6</option>
    <option>Grade 7</option>
    <option>Grade 8</option>
    <option>Grade 9</option>
    <option>Grade 10</option>
    <option>Grade 11</option>
    <option>Grade 12</option>
  </select>

  <label>Date</label>
  <input type="date" id="date">

  <label>Language</label>
  <select id="language">
    <option value="English">English</option>
    <option value="Telugu">Telugu</option>
  </select>

  <div class="timer" id="timer">
    00:00
  </div>

  <div class="buttons">

    <button id="startBtn">
      🎙️ Start Recording
    </button>

    <button id="stopBtn" disabled>
      ⏹ Stop Recording
    </button>

  </div>

  <label>Conversation Text</label>

  <textarea
    id="transcript"
    placeholder="Your spoken words will appear here..."
  ></textarea>

  <div class="buttons">

    <button id="saveBtn">
      💾 Save to Google Sheet
    </button>

    <button id="downloadBtn" disabled>
      ⬇️ Download Audio
    </button>

  </div>

  <div class="status" id="status">
    Ready
  </div>

  <div class="note">
    🎧 You can use your laptop microphone, headset or external microphone.
    <br><br>
    🔊 Audio is downloaded to your computer.
    <br>
    📝 Conversation text is saved to the Google Sheet.
  </div>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT URL
   ========================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyE1juAJGnPJKSfdh41W4K7gpi8k-QUsO_hgmSKI7P7s1ljb48LzEQJT8G4Uw6HRqUL/exec";


/* ==========================================
   VARIABLES
   ========================================== */

let mediaRecorder;
let audioChunks = [];
let audioBlob = null;

let recognition;
let isRecording = false;

let startTime;
let timerInterval;

let finalTranscript = "";


/* ==========================================
   DATE
   ========================================== */

document.getElementById("date").value =
  new Date().toISOString().split("T")[0];


/* ==========================================
   BUTTONS
   ========================================== */

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const saveBtn =
  document.getElementById("saveBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const transcript =
  document.getElementById("transcript");

const status =
  document.getElementById("status");

const timer =
  document.getElementById("timer");


/* ==========================================
   START RECORDING
   ========================================== */

startBtn.addEventListener("click", async function() {

  try {

    const studentName =
      document.getElementById("studentName").value.trim();

    const grade =
      document.getElementById("grade").value;

    if (!studentName) {
      alert("Please enter Student Name.");
      return;
    }

    if (!grade) {
      alert("Please select Grade.");
      return;
    }


    /* MICROPHONE */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    /* AUDIO RECORDER */

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(audioChunks, {
            type: "audio/webm"
          });

        downloadBtn.disabled = false;

        stream.getTracks().forEach(track => {
          track.stop();
        });

      };


    mediaRecorder.start();


    /* SPEECH RECOGNITION */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      alert(
        "Speech recognition is not supported in this browser. Please use Google Chrome."
      );

      mediaRecorder.stop();
      return;
    }


    recognition =
      new SpeechRecognition();

    const selectedLanguage =
      document.getElementById("language").value;

    if (selectedLanguage === "Telugu") {
      recognition.lang = "te-IN";
    } else {
      recognition.lang = "en-IN";
    }

    recognition.continuous = true;
    recognition.interimResults = true;


    finalTranscript = "";

    recognition.onresult =
      function(event) {

        let interimTranscript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const text =
            event.results[i][0].transcript;

          if (event.results[i].isFinal) {

            finalTranscript += text + " ";

          } else {

            interimTranscript += text;

          }

        }

        transcript.value =
          finalTranscript + interimTranscript;

      };


    recognition.onerror =
      function(event) {

        console.log(
          "Speech recognition error:",
          event.error
        );

      };


    recognition.onend =
      function() {

        if (isRecording) {

          try {
            recognition.start();
          } catch(e) {}

        }

      };


    recognition.start();


    /* TIMER */

    startTime = Date.now();

    timerInterval =
      setInterval(updateTimer, 1000);


    isRecording = true;

    startBtn.disabled = true;
    stopBtn.disabled = false;

    status.textContent =
      "🔴 Recording and listening...";

  }

  catch(error) {

    console.error(error);

    alert(
      "Microphone could not be accessed.\n\n" +
      error.message
    );

  }

});


/* ==========================================
   STOP RECORDING
   ========================================== */

stopBtn.addEventListener("click", function() {

  isRecording = false;


  if (mediaRecorder &&
      mediaRecorder.state !== "inactive") {

    mediaRecorder.stop();

  }


  if (recognition) {

    try {
      recognition.stop();
    } catch(e) {}

  }


  clearInterval(timerInterval);


  startBtn.disabled = false;
  stopBtn.disabled = true;


  status.textContent =
    "Recording stopped.";


  /*
     Automatically save after stopping
  */

  setTimeout(function() {

    saveToGoogleSheet();

  }, 1500);

});


/* ==========================================
   TIMER
   ========================================== */

function updateTimer() {

  const elapsed =
    Math.floor(
      (Date.now() - startTime) / 1000
    );

  const minutes =
    Math.floor(elapsed / 60);

  const seconds =
    elapsed % 60;

  timer.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");

}


/* ==========================================
   DOWNLOAD AUDIO
   ========================================== */

downloadBtn.addEventListener(
  "click",
  function() {

    if (!audioBlob) {
      alert("No audio recording available.");
      return;
    }


    const studentName =
      document.getElementById("studentName")
      .value.trim()
      .replace(/[^a-zA-Z0-9_-]/g, "_");


    const grade =
      document.getElementById("grade").value
      .replace(/\s+/g, "_");


    const date =
      document.getElementById("date").value;


    const fileName =
      studentName +
      "_" +
      grade +
      "_" +
      date +
      ".webm";


    const audioURL =
      URL.createObjectURL(audioBlob);


    const link =
      document.createElement("a");

    link.href = audioURL;
    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(audioURL);

  }
);


/* ==========================================
   SAVE TO GOOGLE SHEET
   ========================================== */

saveBtn.addEventListener(
  "click",
  saveToGoogleSheet
);


async function saveToGoogleSheet() {

  const studentName =
    document.getElementById("studentName")
    .value.trim();

  const grade =
    document.getElementById("grade").value;

  const date =
    document.getElementById("date").value;

  const language =
    document.getElementById("language").value;

  const text =
    transcript.value.trim();


  if (!studentName) {

    alert("Please enter Student Name.");
    return;

  }


  if (!grade) {

    alert("Please select Grade.");
    return;

  }


  if (!text) {

    alert(
      "No conversation text found."
    );

    return;

  }


  const data = {

    studentName: studentName,

    grade: grade,

    date: date,

    language: language,

    text: text

  };


  status.textContent =
    "⏳ Saving to Google Sheet...";


  try {

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)

      }
    );


    status.textContent =
      "✅ Conversation sent to Google Sheet.";

  }

  catch(error) {

    console.error(error);

    status.textContent =
      "❌ Could not send to Google Sheet.";

    alert(
      "Error saving to Google Sheet:\n" +
      error.message
    );

  }

}

</script>

</body>
</html>
