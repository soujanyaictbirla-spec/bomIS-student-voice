<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.10);
}

h1 {
  text-align: center;
  color: #1a4d8f;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
  color: #333;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#startBtn {
  background: #198754;
  color: white;
}

#stopBtn {
  background: #dc3545;
  color: white;
}

#saveBtn {
  background: #1a4d8f;
  color: white;
}

button:disabled {
  background: #aaa !important;
  cursor: not-allowed;
}

#status {
  text-align: center;
  margin-top: 20px;
  padding: 12px;
  font-weight: bold;
  line-height: 1.6;
}

#audioStatus {
  text-align: center;
  margin-top: 18px;
  font-weight: bold;
}

audio {
  width: 100%;
  margin-top: 15px;
}

.info {
  background: #eef5ff;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 14px;
  color: #333;
}

.success {
  background: #e8f7ee;
  border-radius: 8px;
}

.error {
  background: #fdeaea;
  border-radius: 8px;
}

</style>

</head>


<body>


<div class="container">

<h1>🎤 BOMIS Student Voice</h1>

<div class="info">
Speak into your microphone. Your speech will be converted to text and the audio recording will be saved to the BOMIS Student Voice Drive folder.
</div>


<!-- STUDENT NAME -->

<label for="studentName">
Student Name
</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name"
>


<!-- GRADE -->

<label for="grade">
Grade
</label>

<select id="grade">

<option value="">
Select Grade
</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<!-- SECTION -->

<label for="section">
Section
</label>

<select id="section">

<option value="">
Select Section
</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
<option>F</option>

</select>


<!-- LANGUAGE -->

<label for="language">
Language
</label>

<select id="language">

<option value="en-IN">
English
</option>

<option value="te-IN">
Telugu
</option>

</select>


<!-- START -->

<button
  id="startBtn"
  onclick="startRecording()"
>
🎤 START SPEAKING
</button>


<!-- STOP -->

<button
  id="stopBtn"
  onclick="stopRecording()"
  disabled
>
⏹ STOP
</button>


<!-- AUDIO STATUS -->

<div id="audioStatus">
🔊 Audio not recorded
</div>


<!-- AUDIO PREVIEW -->

<audio
  id="audioPreview"
  controls
  style="display:none;"
>
</audio>


<!-- TEXT -->

<label for="speechText">
Converted Text
</label>

<textarea
  id="speechText"
  placeholder="Your speech will appear here..."
></textarea>


<!-- SAVE -->

<button
  id="saveBtn"
  onclick="saveRecord()"
  disabled
>
💾 SAVE RECORD
</button>


<!-- STATUS -->

<div id="status"></div>


</div>


<script>


/* =========================================================
   APPS SCRIPT WEB APP URL
   ========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbydLI89-T813TieNgUCGBji3bAbjW-zZzLJrdBgsz-ZIsVzHgebtVtpKakxEiG1ZLU8/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let recognition = null;

let mediaRecorder = null;

let microphoneStream = null;

let audioChunks = [];

let audioBlob = null;

let audioMimeType = "audio/webm";

let finalText = "";

let recordingFinished = false;

let isRecording = false;


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = true;

  recognition.interimResults = true;


  recognition.onresult = function(event) {

    let interimText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
        event.results[i][0].transcript;

      if (event.results[i].isFinal) {

        finalText += transcript + " ";

      } else {

        interimText += transcript;

      }

    }

    document.getElementById("speechText").value =
      finalText + interimText;

  };


  recognition.onerror = function(event) {

    console.log(
      "Speech recognition error:",
      event.error
    );

  };


  recognition.onend = function() {

    console.log("Speech recognition ended.");

  };

}


/* =========================================================
   START RECORDING
   ========================================================= */

async function startRecording() {

  try {

    clearStatus();

    audioChunks = [];

    audioBlob = null;

    recordingFinished = false;

    isRecording = true;

    document.getElementById("saveBtn").disabled = true;

    document.getElementById("startBtn").disabled = true;

    document.getElementById("stopBtn").disabled = false;


    /* GET MICROPHONE */

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    /* DETERMINE AUDIO FORMAT */

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      audioMimeType =
        "audio/webm;codecs=opus";

    }

    else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      audioMimeType =
        "audio/webm";

    }

    else {

      audioMimeType =
        "";

    }


    /* CREATE MEDIA RECORDER */

    if (audioMimeType) {

      mediaRecorder =
        new MediaRecorder(
          microphoneStream,
          {
            mimeType: audioMimeType
          }
        );

    } else {

      mediaRecorder =
        new MediaRecorder(
          microphoneStream
        );

      audioMimeType =
        mediaRecorder.mimeType ||
        "audio/webm";

    }


    /* AUDIO DATA */

    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data && event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };


    /* WHEN RECORDING STOPS */

    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            {
              type: audioMimeType
            }
          );


        console.log(
          "Audio MIME type:",
          audioMimeType
        );

        console.log(
          "Audio size:",
          audioBlob.size
        );


        /* CREATE PREVIEW */

        const audioUrl =
          URL.createObjectURL(audioBlob);


        const audioPreview =
          document.getElementById(
            "audioPreview"
          );


        audioPreview.src =
          audioUrl;


        audioPreview.style.display =
          "block";


        document.getElementById(
          "audioStatus"
        ).innerText =
          "✅ Audio recording completed";


        recordingFinished = true;

        isRecording = false;


        document.getElementById(
          "startBtn"
        ).disabled = false;


        document.getElementById(
          "stopBtn"
        ).disabled = true;


        document.getElementById(
          "saveBtn"
        ).disabled = false;


        /* RELEASE MICROPHONE */

        if (microphoneStream) {

          microphoneStream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }


        document.getElementById(
          "status"
        ).innerText =
          "✅ Recording ready. Click SAVE RECORD.";

      };


    /* START AUDIO */

    mediaRecorder.start();


    /* START SPEECH RECOGNITION */

    finalText =
      document.getElementById(
        "speechText"
      ).value;


    if (recognition) {

      recognition.lang =
        document.getElementById(
          "language"
        ).value;


      try {

        recognition.start();

      }

      catch(error) {

        console.log(
          "Recognition start:",
          error
        );

      }

    }


    document.getElementById(
      "audioStatus"
    ).innerText =
      "🔴 Recording audio...";


    document.getElementById(
      "status"
    ).innerText =
      "🎤 Listening... Please speak.";

  }

  catch(error) {

    console.error(error);

    isRecording = false;

    document.getElementById(
      "startBtn"
    ).disabled = false;

    document.getElementById(
      "stopBtn"
    ).disabled = true;


    document.getElementById(
      "status"
    ).innerHTML =
      "❌ <b>Microphone Error</b><br>" +
      error.message;

  }

}


/* =========================================================
   STOP RECORDING
   ========================================================= */

function stopRecording() {

  if (!isRecording) {
    return;
  }


  /* STOP SPEECH */

  if (recognition) {

    try {

      recognition.stop();

    }

    catch(error) {

      console.log(error);

    }

  }


  /* STOP AUDIO */

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    document.getElementById(
      "audioStatus"
    ).innerText =
      "⏳ Preparing audio...";


    mediaRecorder.stop();

  }

}


/* =========================================================
   BLOB → BASE64
   ========================================================= */

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          try {

            const result =
              reader.result;


            const base64 =
              result.split(",")[1];


            if (!base64) {

              reject(
                new Error(
                  "Could not convert audio to Base64."
                )
              );

              return;

            }


            resolve(base64);

          }

          catch(error) {

            reject(error);

          }

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read audio file."
            )
          );

        };


      reader.readAsDataURL(blob);

    }
  );

}


/* =========================================================
   SAVE RECORD
   ========================================================= */

async function saveRecord() {

  try {

    if (
      !audioBlob ||
      !recordingFinished
    ) {

      alert(
        "Please record and stop the audio first."
      );

      return;

    }


    /* STUDENT NAME */

    const name =
      document.getElementById(
        "studentName"
      ).value.trim();


    /* GRADE */

    const grade =
      document.getElementById(
        "grade"
      ).value;


    /* SECTION */

    const section =
      document.getElementById(
        "section"
      ).value;


    /* LANGUAGE */

    const languageSelect =
      document.getElementById(
        "language"
      );


    const language =
      languageSelect.options[
        languageSelect.selectedIndex
      ].text;


    /* TEXT */

    const text =
      document.getElementById(
        "speechText"
      ).value.trim();


    /* VALIDATION */

    if (!name) {

      alert(
        "Please enter Student Name."
      );

      return;

    }


    if (!grade) {

      alert(
        "Please select Grade."
      );

      return;

    }


    if (!section) {

      alert(
        "Please select Section."
      );

      return;

    }


    if (!text) {

      alert(
        "Please speak something so that text can be converted."
      );

      return;

    }


    /* DISABLE SAVE */

    document.getElementById(
      "saveBtn"
    ).disabled = true;


    document.getElementById(
      "status"
    ).innerText =
      "⏳ Preparing audio...";


    /* CONVERT AUDIO */

    const base64 =
      await blobToBase64(
        audioBlob
      );


    console.log(
      "Audio bytes:",
      audioBlob.size
    );


    console.log(
      "Base64 length:",
      base64.length
    );


    /* CREATE DATA */

    const payload = {

      name: name,

      grade: grade,

      section: section,

      language: language,

      text: text,

      audioBase64: base64,

      audioMimeType: audioMimeType

    };


    console.log(
      "Sending record to Apps Script..."
    );


    document.getElementById(
      "status"
    ).innerText =
      "⏳ Saving audio to BOMIS Student Voice...";


    /* SEND TO APPS SCRIPT */

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(payload)

        }
      );


    console.log(
      "HTTP status:",
      response.status
    );


    const responseText =
      await response.text();


    console.log(
      "Apps Script response:",
      responseText
    );


    if (!responseText) {

      throw new Error(
        "The Apps Script returned an empty response."
      );

    }


    /* PARSE RESPONSE */

    let result;

    try {

      result =
        JSON.parse(
          responseText
        );

    }

    catch(error) {

      console.error(
        "Invalid JSON:",
        responseText
      );

      throw new Error(
        "Apps Script returned an invalid response."
      );

    }


    /* CHECK SUCCESS */

    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        result.message ||
        "Audio upload failed."
      );

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    document.getElementById(
      "status"
    ).className =
      "success";


    document.getElementById(
      "status"
    ).innerHTML =

      "✅ <b>RECORD SAVED SUCCESSFULLY!</b>" +

      "<br><br>" +

      "📁 File: " +

      (
        result.fileName ||
        "Audio file created"
      ) +

      "<br>" +

      "💾 Size: " +

      (
        result.audioBytes ||
        audioBlob.size
      ) +

      " bytes" +

      "<br><br>" +

      (
        result.fileUrl

        ?

        '<a href="' +
        result.fileUrl +
        '" target="_blank">' +
        "🔊 OPEN AUDIO FILE" +
        "</a>"

        :

        "Audio file saved to Drive."
      );


    document.getElementById(
      "audioStatus"
    ).innerText =
      "✅ Saved to BOMIS Student Voice";


    /* RESET FORM */

    document.getElementById(
      "studentName"
    ).value = "";


    document.getElementById(
      "grade"
    ).value = "";


    document.getElementById(
      "section"
    ).value = "";


    document.getElementById(
      "speechText"
    ).value = "";


    document.getElementById(
      "audioPreview"
    ).style.display =
      "none";


    document.getElementById(
      "audioPreview"
    ).src = "";


    audioBlob = null;

    audioChunks = [];

    recordingFinished = false;

    mediaRecorder = null;

  }

  catch(error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    document.getElementById(
      "status"
    ).className =
      "error";


    document.getElementById(
      "status"
    ).innerHTML =

      "❌ <b>UPLOAD FAILED</b>" +

      "<br><br>" +

      error.message;


    document.getElementById(
      "saveBtn"
    ).disabled = false;

  }

}


/* =========================================================
   CLEAR STATUS
   ========================================================= */

function clearStatus() {

  const status =
    document.getElementById(
      "status"
    );

  status.innerHTML = "";

  status.className = "";

}


/* =========================================================
   CHECK BROWSER SUPPORT
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    if (!SpeechRecognition) {

      document.getElementById(
        "status"
      ).innerHTML =

        "⚠️ Speech recognition is not supported in this browser. Please use Google Chrome.";

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      document.getElementById(
        "status"
      ).innerHTML =

        "❌ Microphone access is not supported in this browser.";

    }

  }
);


</script>

</body>

</html>
