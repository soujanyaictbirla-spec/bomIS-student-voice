<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice</title>

<style>

body {
  font-family: Arial;
  background: #f4f7fb;
  padding: 20px;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

h1 {
  text-align: center;
  color: #1a4d8f;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
textarea {

  width: 100%;
  padding: 12px;
  margin-top: 5px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;

}

textarea {
  height: 180px;
}

button {

  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;

}

#startBtn {
  background: #198754;
  color: white;
}

#stopBtn {
  background: #dc3545;
  color: white;
}

#saveBtn {
  background: #1a4d8f;
  color: white;
}

button:disabled {
  background: #aaa;
}

#status,
#audioStatus {

  text-align: center;
  margin-top: 15px;
  font-weight: bold;

}

audio {

  width: 100%;
  margin-top: 15px;

}

</style>

</head>


<body>


<div class="container">


<h1>🎤 BOMIS Student Voice</h1>


<label>Student Name</label>

<input
id="studentName"
placeholder="Enter student name">


<label>Grade</label>

<select id="grade">

<option value="">Select Grade</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<label>Section</label>

<select id="section">

<option value="">Select Section</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>

</select>


<label>Language</label>

<select id="language">

<option value="en-IN">
English
</option>

<option value="te-IN">
Telugu
</option>

</select>


<button
id="startBtn"
onclick="startRecording()">

🎤 START SPEAKING

</button>


<button
id="stopBtn"
onclick="stopRecording()"
disabled>

⏹ STOP

</button>


<div id="audioStatus">

🔊 Audio not recorded

</div>


<audio
id="audioPreview"
controls
style="display:none">

</audio>


<label>Converted Text</label>

<textarea
id="speechText"
placeholder="Your speech will appear here...">
</textarea>


<button
id="saveBtn"
onclick="saveRecord()"
disabled>

💾 SAVE RECORD

</button>


<div id="status"></div>


</div>


<script>


const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbydLI89-T813TieNgUCGBji3bAbjW-zZzLJrdBgsz-ZIsVzHgebtVtpKakxEiG1ZLU8/exec";


let recognition = null;

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let microphoneStream = null;

let finalText = "";

let recordingFinished = false;

let audioMimeType = "audio/webm";


/* ==========================================
   SPEECH RECOGNITION
========================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
  new SpeechRecognition();

  recognition.continuous = true;

  recognition.interimResults = true;


  recognition.onresult =
  function(event) {

    let interim = "";


    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
      event.results[i][0].transcript;


      if (
        event.results[i].isFinal
      ) {

        finalText +=
        transcript + " ";

      }
      else {

        interim += transcript;

      }

    }


    document.getElementById(
      "speechText"
    ).value =
    finalText + interim;

  };


  recognition.onerror =
  function(event) {

    console.log(
      "Speech error:",
      event.error
    );

  };

}


/* ==========================================
   START
========================================== */

async function startRecording() {

  try {


    audioChunks = [];

    audioBlob = null;

    recordingFinished = false;


    document.getElementById(
      "saveBtn"
    ).disabled = true;


    microphoneStream =
    await navigator.mediaDevices
    .getUserMedia({
      audio: true
    });


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      audioMimeType =
      "audio/webm;codecs=opus";

    }
    else {

      audioMimeType =
      "audio/webm";

    }


    mediaRecorder =
    new MediaRecorder(
      microphoneStream,
      {
        mimeType:
        audioMimeType
      }
    );


    mediaRecorder.ondataavailable =
    function(event) {

      if (
        event.data.size > 0
      ) {

        audioChunks.push(
          event.data
        );

      }

    };


    mediaRecorder.onstop =
    function() {


      audioBlob =
      new Blob(
        audioChunks,
        {
          type:
          audioMimeType
        }
      );


      console.log(
        "Audio size:",
        audioBlob.size
      );


      const audioUrl =
      URL.createObjectURL(
        audioBlob
      );


      document.getElementById(
        "audioPreview"
      ).src =
      audioUrl;


      document.getElementById(
        "audioPreview"
      ).style.display =
      "block";


      document.getElementById(
        "audioStatus"
      ).innerText =
      "✅ Audio recording completed";


      recordingFinished = true;


      document.getElementById(
        "saveBtn"
      ).disabled = false;


      document.getElementById(
        "startBtn"
      ).disabled = false;


      document.getElementById(
        "stopBtn"
      ).disabled = true;


      microphoneStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    };


    mediaRecorder.start();


    finalText =
    document.getElementById(
      "speechText"
    ).value;


    if (recognition) {

      recognition.lang =
      document.getElementById(
        "language"
      ).value;


      recognition.start();

    }


    document.getElementById(
      "audioStatus"
    ).innerText =
    "🔴 Recording audio...";


    document.getElementById(
      "status"
    ).innerText =
    "🎤 Listening...";

  }


  catch(error) {

    document.getElementById(
      "status"
    ).innerText =
    "❌ Microphone error: " +
    error.message;

  }

}


/* ==========================================
   STOP
========================================== */

function stopRecording() {


  if (recognition) {

    try {
      recognition.stop();
    }
    catch(e) {}

  }


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    document.getElementById(
      "audioStatus"
    ).innerText =
    "⏳ Preparing audio...";


    mediaRecorder.stop();

  }

}


/* ==========================================
   BLOB TO BASE64
========================================== */

function blobToBase64(blob) {

  return new Promise(
  function(resolve, reject) {

    const reader =
    new FileReader();


    reader.onload =
    function() {

      const result =
      reader.result;


      const base64 =
      result.split(",")[1];


      resolve(base64);

    };


    reader.onerror =
    reject;


    reader.readAsDataURL(blob);

  });

}


/* ==========================================
   SAVE
========================================== */

async function saveRecord() {


  if (
    !audioBlob ||
    !recordingFinished
  ) {

    alert(
      "Please record and stop the audio first."
    );

    return;

  }


  const name =
  document.getElementById(
    "studentName"
  ).value.trim();


  const grade =
  document.getElementById(
    "grade"
  ).value;


  const section =
  document.getElementById(
    "section"
  ).value;


  const languageElement =
  document.getElementById(
    "language"
  );


  const language =
  languageElement.options[
    languageElement.selectedIndex
  ].text;


  const text =
  document.getElementById(
    "speechText"
  ).value.trim();


  if (
    !name ||
    !grade ||
    !section ||
    !text
  ) {

    alert(
      "Please enter Student Name, Grade, Section and Speech Text."
    );

    return;

  }


  document.getElementById(
    "saveBtn"
  ).disabled = true;


  document.getElementById(
    "status"
  ).innerText =
  "⏳ Converting audio...";


  try {


    const base64 =
    await blobToBase64(
      audioBlob
    );


    console.log(
      "Audio bytes:",
      audioBlob.size
    );


    console.log(
      "Base64 characters:",
      base64.length
    );


    document.getElementById(
      "status"
    ).innerText =
    "⏳ Saving audio to BOMIS Student Voice...";


    const payload = {

      name:
      name,

      grade:
      grade,

      section:
      section,

      language:
      language,

      text:
      text,

      audioBase64:
      base64,

      audioMimeType:
      audioMimeType

    };


    const response =
    await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:
        JSON.stringify(payload)
      }
    );


    const responseText =
    await response.text();


    console.log(
      "Server response:",
      responseText
    );


    const result =
    JSON.parse(
      responseText
    );


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    document.getElementById(
      "status"
    ).innerHTML =

    "✅ <b>AUDIO SAVED SUCCESSFULLY!</b>" +

    "<br><br>" +

    "📁 " +
    result.fileName +

    "<br><br>" +

    '<a href="' +
    result.audioUrl +
    '" target="_blank">' +

    "🔊 OPEN AUDIO FILE" +

    "</a>";


    document.getElementById(
      "audioStatus"
    ).innerText =
    "✅ Saved to BOMIS Student Voice";


    // RESET

    document.getElementById(
      "studentName"
    ).value = "";


    document.getElementById(
      "grade"
    ).value = "";


    document.getElementById(
      "section"
    ).value = "";


    document.getElementById(
      "speechText"
    ).value = "";


    audioBlob = null;

    audioChunks = [];

    recordingFinished = false;


  }


  catch(error) {


    console.error(error);


    document.getElementById(
      "status"
    ).innerHTML =
    "❌ <b>UPLOAD FAILED</b><br>" +
    error.message;


    document.getElementById(
      "saveBtn"
    ).disabled = false;

  }

}

</script>

</body>

</html>
