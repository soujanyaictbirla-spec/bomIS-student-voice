<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Student Voice Recorder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    .buttons {
      text-align: center;
      margin-top: 25px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    #startBtn {
      background: #28a745;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #downloadBtn {
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    #timer {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 15px;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    #audioPlayer {
      width: 100%;
      margin-top: 15px;
    }

    .section {
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎙️ BOMIS Student Voice Recorder</h1>

  <label>Student Name</label>
  <input type="text" id="studentName" placeholder="Enter student name">

  <label>Grade</label>
  <select id="grade">
    <option value="">Select Grade</option>
    <option>Grade 1</option>
    <option>Grade 2</option>
    <option>Grade 3</option>
    <option>Grade 4</option>
    <option>Grade 5</option>
    <option>Grade 6</option>
    <option>Grade 7</option>
    <option>Grade 8</option>
    <option>Grade 9</option>
    <option>Grade 10</option>
    <option>Grade 11</option>
    <option>Grade 12</option>
  </select>

  <label>Date</label>
  <input type="date" id="date">

  <label>Language</label>
  <select id="language">
    <option value="English">English</option>
    <option value="Telugu">Telugu</option>
  </select>

  <div id="timer">00:00</div>

  <div class="buttons">

    <button id="startBtn">
      🎙️ Start Recording
    </button>

    <button id="stopBtn" disabled>
      ⏹️ Stop Recording
    </button>

  </div>

  <div id="status">
    Ready to record
  </div>

  <!-- AUDIO PLAYER APPEARS AFTER STOP -->
  <div id="audioSection" style="display:none;">

    <audio id="audioPlayer" controls></audio>

    <div class="buttons">
      <button id="downloadBtn">
        ⬇️ Download Audio
      </button>
    </div>

  </div>

  <div class="section">

    <label>📝 Conversation Text</label>

    <textarea
      id="transcript"
      placeholder="Spoken text will appear here..."
      readonly
    ></textarea>

  </div>

</div>


<script>

  // ============================================
  // GOOGLE APPS SCRIPT URL
  // ============================================

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyE1juAJGnPJKSfdh41W4K7gpi8k-QUsO_hgmSKI7P7s1ljb48LzEQJT8G4Uw6HRqUL/exec";


  // ============================================
  // VARIABLES
  // ============================================

  let mediaRecorder;
  let audioChunks = [];
  let audioBlob = null;

  let recognition;
  let isRecording = false;

  let timerInterval;
  let seconds = 0;

  let finalTranscript = "";


  // ============================================
  // PAGE LOAD
  // ============================================

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];


  // ============================================
  // ELEMENTS
  // ============================================

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const timer =
    document.getElementById("timer");

  const transcriptBox =
    document.getElementById("transcript");

  const status =
    document.getElementById("status");

  const audioPlayer =
    document.getElementById("audioPlayer");

  const audioSection =
    document.getElementById("audioSection");


  // ============================================
  // SPEECH RECOGNITION
  // ============================================

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.maxAlternatives = 1;

    recognition.onresult = function(event) {

      let interimTranscript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0].transcript;

        if (event.results[i].isFinal) {

          finalTranscript += text + " ";

        } else {

          interimTranscript += text;

        }

      }

      transcriptBox.value =
        finalTranscript + interimTranscript;

    };

    recognition.onerror = function(event) {

      console.log(
        "Speech recognition error:",
        event.error
      );

    };

    recognition.onend = function() {

      if (isRecording) {

        try {
          recognition.start();
        } catch (e) {
          console.log(e);
        }

      }

    };

  } else {

    alert(
      "Speech recognition is not supported. Please use Google Chrome."
    );

  }


  // ============================================
  // START RECORDING
  // ============================================

  startBtn.addEventListener("click", async function() {

    const studentName =
      document.getElementById("studentName").value.trim();

    const grade =
      document.getElementById("grade").value;

    if (!studentName) {

      alert("Please enter Student Name.");

      return;
    }

    if (!grade) {

      alert("Please select Grade.");

      return;
    }


    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      audioChunks = [];

      audioBlob = null;

      finalTranscript = "";

      transcriptBox.value = "";

      audioSection.style.display = "none";


      // ========================================
      // MEDIA RECORDER
      // ========================================

      mediaRecorder =
        new MediaRecorder(stream);


      mediaRecorder.ondataavailable =
        function(event) {

          if (event.data.size > 0) {

            audioChunks.push(event.data);

          }

        };


      mediaRecorder.onstop =
        function() {

          audioBlob =
            new Blob(
              audioChunks,
              { type: "audio/webm" }
            );


          // ====================================
          // SHOW AUDIO PLAYER
          // ====================================

          const audioURL =
            URL.createObjectURL(audioBlob);

          audioPlayer.src = audioURL;

          audioSection.style.display = "block";


          status.innerText =
            "Recording stopped. Saving text to Google Sheet...";


          // ====================================
          // AUTOMATIC GOOGLE SHEET SAVE
          // ====================================

          setTimeout(function() {

            saveToGoogleSheet();

          }, 1500);


          // Stop microphone
          stream.getTracks().forEach(
            track => track.stop()
          );

        };


      mediaRecorder.start();


      // ========================================
      // SPEECH RECOGNITION LANGUAGE
      // ========================================

      const language =
        document.getElementById("language").value;


      if (recognition) {

        recognition.lang =
          language === "Telugu"
            ? "te-IN"
            : "en-IN";


        try {

          recognition.start();

        } catch (e) {

          console.log(e);

        }

      }


      // ========================================
      // BUTTONS
      // ========================================

      startBtn.disabled = true;

      stopBtn.disabled = false;


      // ========================================
      // TIMER
      // ========================================

      seconds = 0;

      timer.innerText = "00:00";

      timerInterval =
        setInterval(function() {

          seconds++;

          const mins =
            Math.floor(seconds / 60);

          const secs =
            seconds % 60;

          timer.innerText =
            String(mins).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0");

        }, 1000);


      status.innerText =
        "🎙️ Recording... Speak now";


    } catch (error) {

      console.error(error);

      alert(
        "Microphone permission is required.\n\n" +
        "Please allow microphone access in Chrome and try again."
      );

    }

  });


  // ============================================
  // STOP RECORDING
  // ============================================

  stopBtn.addEventListener("click", function() {

    isRecording = false;


    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {

      mediaRecorder.stop();

    }


    if (recognition) {

      try {

        recognition.stop();

      } catch (e) {

        console.log(e);

      }

    }


    clearInterval(timerInterval);


    startBtn.disabled = false;

    stopBtn.disabled = true;


    status.innerText =
      "Processing recording...";

  });


  // ============================================
  // DOWNLOAD AUDIO
  // ============================================

  downloadBtn.addEventListener(
    "click",
    function() {

      if (!audioBlob) {

        alert("No recording available.");

        return;
      }


      const studentName =
        document.getElementById("studentName")
          .value
          .trim()
          .replace(/[^a-z0-9]/gi, "_");


      const grade =
        document.getElementById("grade").value
          .replace(/[^a-z0-9]/gi, "_");


      const date =
        document.getElementById("date").value;


      const filename =
        studentName +
        "_" +
        grade +
        "_" +
        date +
        ".webm";


      const url =
        URL.createObjectURL(audioBlob);


      const a =
        document.createElement("a");

      a.href = url;

      a.download = filename;

      document.body.appendChild(a);

      a.click();

      document.body.removeChild(a);

      setTimeout(function() {

        URL.revokeObjectURL(url);

      }, 1000);

    }
  );


  // ============================================
  // AUTOMATICALLY SAVE TEXT TO GOOGLE SHEET
  // ============================================

  async function saveToGoogleSheet() {

    const studentName =
      document.getElementById("studentName")
        .value.trim();

    const grade =
      document.getElementById("grade").value;

    const date =
      document.getElementById("date").value;

    const language =
      document.getElementById("language").value;

    const text =
      transcriptBox.value.trim();


    if (!studentName ||
        !grade ||
        !text) {

      status.innerText =
        "⚠️ Text was not saved because required information is missing.";

      return;
    }


    const data = {

      studentName: studentName,

      grade: grade,

      date: date,

      language: language,

      text: text

    };


    try {

      await fetch(
        GOOGLE_SCRIPT_URL,
        {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify(data)
        }
      );


      status.innerText =
        "✅ Text automatically saved to Google Sheet";

    } catch (error) {

      console.error(error);

      status.innerText =
        "⚠️ Could not send text to Google Sheet.";

    }

  }

</script>

</body>
</html>
