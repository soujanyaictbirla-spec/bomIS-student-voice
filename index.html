<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Student Voice Recorder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      padding: 20px;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #174a7e;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      height: 180px;
    }

    button {
      padding: 12px 18px;
      margin: 10px 5px 0 0;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    #start {
      background: #198754;
      color: white;
    }

    #stop {
      background: #dc3545;
      color: white;
    }

    #download {
      background: #6f42c1;
      color: white;
    }

    #save {
      background: #174a7e;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    #timer {
      text-align: center;
      font-size: 28px;
      margin: 15px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎙️ BOMIS Student Voice Recorder</h1>

  <label>Student Name</label>
  <input id="studentName" type="text">

  <label>Grade</label>
  <select id="grade">
    <option value="">Select Grade</option>
    <option>Grade 1</option>
    <option>Grade 2</option>
    <option>Grade 3</option>
    <option>Grade 4</option>
    <option>Grade 5</option>
    <option>Grade 6</option>
    <option>Grade 7</option>
    <option>Grade 8</option>
    <option>Grade 9</option>
    <option>Grade 10</option>
    <option>Grade 11</option>
    <option>Grade 12</option>
  </select>

  <label>Date</label>
  <input id="date" type="date">

  <label>Language</label>
  <select id="language">
    <option value="English">English</option>
    <option value="Telugu">Telugu</option>
  </select>

  <div id="timer">00:00</div>

  <button id="start">🎙️ Start Recording</button>
  <button id="stop" disabled>⏹ Stop</button>

  <label>Conversation Text</label>
  <textarea id="transcript"
    placeholder="Speak after pressing Start..."></textarea>

  <br>

  <button id="download" disabled>
    ⬇️ Download Audio
  </button>

  <button id="save">
    💾 Save to Google Sheet
  </button>

  <div id="status">Ready</div>

</div>


<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyE1juAJGnPJKSfdh41W4K7gpi8k-QUsO_hgmSKI7P7s1ljb48LzEQJT8G4Uw6HRqUL/exec";


document.getElementById("date").value =
new Date().toISOString().split("T")[0];


let recorder;
let chunks = [];
let audioBlob;

let recognition;
let recording = false;

let finalText = "";

let timerInterval;
let seconds = 0;


/* START */

document.getElementById("start").onclick =
async function() {

  try {

    const name =
      document.getElementById("studentName").value.trim();

    const grade =
      document.getElementById("grade").value;

    if (!name) {
      alert("Please enter Student Name");
      return;
    }

    if (!grade) {
      alert("Please select Grade");
      return;
    }


    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    chunks = [];

    recorder =
      new MediaRecorder(stream);


    recorder.ondataavailable =
    function(e) {

      if (e.data.size > 0) {
        chunks.push(e.data);
      }

    };


    recorder.onstop =
    function() {

      audioBlob =
        new Blob(chunks, {
          type: "audio/webm"
        });

      document.getElementById("download")
        .disabled = false;

      stream.getTracks().forEach(
        track => track.stop()
      );

    };


    recorder.start();


    /* SPEECH */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      alert(
        "Please use Google Chrome for speech recognition."
      );

      recorder.stop();
      return;
    }


    recognition =
      new SpeechRecognition();


    const language =
      document.getElementById("language").value;


    recognition.lang =
      language === "Telugu"
      ? "te-IN"
      : "en-IN";


    recognition.continuous = true;
    recognition.interimResults = true;


    finalText = "";


    recognition.onresult =
    function(event) {

      let interim = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0].transcript;


        if (event.results[i].isFinal) {

          finalText += text + " ";

        } else {

          interim += text;

        }

      }


      document.getElementById("transcript")
        .value =
        finalText + interim;

    };


    recognition.onerror =
    function(event) {

      console.log(event.error);

    };


    recognition.start();


    /* TIMER */

    seconds = 0;

    document.getElementById("timer")
      .textContent = "00:00";


    timerInterval =
      setInterval(function() {

        seconds++;

        const min =
          Math.floor(seconds / 60);

        const sec =
          seconds % 60;


        document.getElementById("timer")
          .textContent =
          String(min).padStart(2,"0")
          + ":" +
          String(sec).padStart(2,"0");

      },1000);


    recording = true;


    document.getElementById("start")
      .disabled = true;

    document.getElementById("stop")
      .disabled = false;


    document.getElementById("status")
      .textContent =
      "🔴 Recording...";

  }

  catch(error) {

    alert(
      "Microphone error: " +
      error.message
    );

  }

};


/* STOP */

document.getElementById("stop").onclick =
function() {

  recording = false;


  if (recorder &&
      recorder.state !== "inactive") {

    recorder.stop();

  }


  if (recognition) {

    try {
      recognition.stop();
    }
    catch(e) {}

  }


  clearInterval(timerInterval);


  document.getElementById("start")
    .disabled = false;

  document.getElementById("stop")
    .disabled = true;


  document.getElementById("status")
    .textContent =
    "Recording stopped.";


};


/* DOWNLOAD */

document.getElementById("download").onclick =
function() {

  if (!audioBlob) {
    alert("No audio available.");
    return;
  }


  const name =
    document.getElementById("studentName")
      .value
      .trim()
      .replace(/[^a-zA-Z0-9_-]/g,"_");


  const grade =
    document.getElementById("grade")
      .value
      .replace(/\s+/g,"_");


  const date =
    document.getElementById("date")
      .value;


  const filename =
    name + "_" +
    grade + "_" +
    date +
    ".webm";


  const url =
    URL.createObjectURL(audioBlob);


  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

};


/* SAVE */

document.getElementById("save").onclick =
async function() {

  const name =
    document.getElementById("studentName")
      .value.trim();

  const grade =
    document.getElementById("grade")
      .value;

  const date =
    document.getElementById("date")
      .value;

  const language =
    document.getElementById("language")
      .value;

  const text =
    document.getElementById("transcript")
      .value.trim();


  if (!name) {
    alert("Please enter Student Name");
    return;
  }


  if (!grade) {
    alert("Please select Grade");
    return;
  }


  if (!text) {
    alert("No conversation text found");
    return;
  }


  document.getElementById("status")
    .textContent =
    "Saving to Google Sheet...";


  const data = {

    studentName: name,

    grade: grade,

    date: date,

    language: language,

    text: text

  };


  try {

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)
      }
    );


    document.getElementById("status")
      .textContent =
      "✅ Saved to Google Sheet";

  }

  catch(error) {

    console.error(error);

    document.getElementById("status")
      .textContent =
      "❌ Save failed";

    alert(error.message);

  }

};

</script>

</body>
</html>
