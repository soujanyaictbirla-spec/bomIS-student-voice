<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOMIS Student Voice Recorder</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }

    #startBtn {
        background: #28a745;
        color: white;
    }

    #stopBtn {
        background: #dc3545;
        color: white;
    }

    #downloadBtn {
        background: #007bff;
        color: white;
        width: 100%;
        margin-top: 15px;
        display: none;
    }

    #newStudentBtn {
        background: #6f42c1;
        color: white;
        width: 100%;
        margin-top: 10px;
        display: none;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        margin-top: 20px;
        padding: 15px;
        background: #f1f3f5;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    }

    .recording {
        color: red;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0.4;
        }
    }

    .text-box {
        margin-top: 20px;
        padding: 15px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        min-height: 100px;
    }

    #transcript {
        margin-top: 10px;
        line-height: 1.6;
    }

    audio {
        width: 100%;
        margin-top: 15px;
        display: none;
    }

    .student-info {
        margin-top: 15px;
        padding: 12px;
        background: #eef4ff;
        border-radius: 8px;
        display: none;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎙️ BOMIS Student Voice Recorder</h1>

    <div class="subtitle">
        Speech Recording & Speech-to-Text
    </div>

    <label>Student Name</label>
    <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
    >

    <label>Grade</label>
    <select id="grade">
        <option value="">Select Grade</option>
        <option>Grade 1</option>
        <option>Grade 2</option>
        <option>Grade 3</option>
        <option>Grade 4</option>
        <option>Grade 5</option>
        <option>Grade 6</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>
    </select>

    <label>Section</label>
    <select id="section">
        <option value="">Select Section</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
        <option>F</option>
    </select>

    <label>Language</label>
    <select id="language">
        <option value="en-IN">English</option>
        <option value="te-IN">Telugu</option>
    </select>

    <div class="buttons">
        <button id="startBtn">
            🎙️ Start Recording
        </button>

        <button id="stopBtn" disabled>
            ⏹ Stop
        </button>
    </div>

    <div id="status" class="status">
        Ready to record
    </div>

    <div id="studentInfo" class="student-info"></div>

    <div class="text-box">
        <strong>📝 Speech-to-Text:</strong>

        <div id="transcript">
            Your spoken words will appear here...
        </div>
    </div>

    <audio id="audioPlayer" controls></audio>

    <button id="downloadBtn">
        ⬇️ Download Audio
    </button>

    <button id="newStudentBtn">
        👩‍🎓 New Student
    </button>

</div>


<script>

let mediaRecorder;
let audioChunks = [];
let audioBlob;
let audioUrl;

let recognition;
let finalTranscript = "";
let isRecording = false;


// =====================================================
// START RECORDING
// =====================================================

document.getElementById("startBtn").addEventListener("click", async function() {

    const name =
        document.getElementById("studentName").value.trim();

    const grade =
        document.getElementById("grade").value;

    const section =
        document.getElementById("section").value;

    if (!name) {
        alert("Please enter Student Name.");
        return;
    }

    if (!grade) {
        alert("Please select Grade.");
        return;
    }

    if (!section) {
        alert("Please select Section.");
        return;
    }


    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioChunks = [];


        // Select supported audio format

        let options = {};

        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            options = {
                mimeType: "audio/webm;codecs=opus"
            };

        }
        else if (
            MediaRecorder.isTypeSupported("audio/webm")
        ) {

            options = {
                mimeType: "audio/webm"
            };

        }


        mediaRecorder =
            new MediaRecorder(stream, options);


        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };


        mediaRecorder.onstop =
            function() {

                audioBlob = new Blob(
                    audioChunks,
                    {
                        type:
                            mediaRecorder.mimeType ||
                            "audio/webm"
                    }
                );


                audioUrl =
                    URL.createObjectURL(audioBlob);


                const audioPlayer =
                    document.getElementById(
                        "audioPlayer"
                    );

                audioPlayer.src = audioUrl;
                audioPlayer.style.display = "block";


                // Create filename

                const safeName =
                    name.replace(
                        /[^a-zA-Z0-9-_ ]/g,
                        "_"
                    );

                const safeGrade =
                    grade.replace(
                        /[^a-zA-Z0-9-_ ]/g,
                        "_"
                    );

                const safeSection =
                    section.replace(
                        /[^a-zA-Z0-9-_ ]/g,
                        "_"
                    );


                const now = new Date();


                const timestamp =
                    now.getFullYear() +
                    "-" +
                    String(
                        now.getMonth() + 1
                    ).padStart(2, "0") +
                    "-" +
                    String(
                        now.getDate()
                    ).padStart(2, "0") +
                    "_" +
                    String(
                        now.getHours()
                    ).padStart(2, "0") +
                    "-" +
                    String(
                        now.getMinutes()
                    ).padStart(2, "0") +
                    "-" +
                    String(
                        now.getSeconds()
                    ).padStart(2, "0");


                const fileName =
                    safeName +
                    "_" +
                    safeGrade +
                    "_" +
                    safeSection +
                    "_" +
                    timestamp +
                    ".webm";


                // Download button

                const downloadBtn =
                    document.getElementById(
                        "downloadBtn"
                    );

                downloadBtn.style.display =
                    "block";


                downloadBtn.onclick =
                    function() {

                        const link =
                            document.createElement("a");

                        link.href = audioUrl;

                        link.download =
                            fileName;

                        document.body.appendChild(
                            link
                        );

                        link.click();

                        document.body.removeChild(
                            link
                        );


                        document.getElementById(
                            "status"
                        ).innerHTML =
                            "✅ Audio downloaded successfully";
                    };


                // Show new student button

                document.getElementById(
                    "newStudentBtn"
                ).style.display =
                    "block";


                document.getElementById(
                    "status"
                ).innerHTML =
                    "✅ Recording completed. Download the audio.";


                document.getElementById(
                    "status"
                ).classList.remove(
                    "recording"
                );


                // Stop microphone

                stream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

            };


        // Start recorder

        mediaRecorder.start();

        isRecording = true;


        document.getElementById(
            "startBtn"
        ).disabled = true;

        document.getElementById(
            "stopBtn"
        ).disabled = false;


        document.getElementById(
            "downloadBtn"
        ).style.display = "none";

        document.getElementById(
            "newStudentBtn"
        ).style.display = "none";


        document.getElementById(
            "status"
        ).innerHTML =
            "🔴 Recording... Speak now";


        document.getElementById(
            "status"
        ).classList.add(
            "recording"
        );


        // Show student details

        document.getElementById(
            "studentInfo"
        ).style.display = "block";


        document.getElementById(
            "studentInfo"
        ).innerHTML =
            "<strong>Student:</strong> " +
            name +
            " &nbsp; | &nbsp; " +
            grade +
            " &nbsp; | &nbsp; Section " +
            section;


        // Start speech recognition

        startSpeechRecognition();

    }

    catch (error) {

        console.error(error);

        alert(
            "Microphone could not be accessed.\n\n" +
            "Please allow microphone permission in Chrome."
        );

    }

});


// =====================================================
// STOP RECORDING
// =====================================================

document.getElementById("stopBtn")
.addEventListener("click", function() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }


    if (recognition) {

        try {
            recognition.stop();
        }
        catch(e) {}

    }


    isRecording = false;


    document.getElementById(
        "startBtn"
    ).disabled = false;


    document.getElementById(
        "stopBtn"
    ).disabled = true;

});


// =====================================================
// SPEECH RECOGNITION
// =====================================================

function startSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        document.getElementById(
            "transcript"
        ).innerHTML =
            "Speech-to-text is not supported in this browser.";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.continuous = true;

    recognition.interimResults = true;


    const language =
        document.getElementById(
            "language"
        ).value;


    recognition.lang = language;


    finalTranscript = "";


    recognition.onresult =
        function(event) {

            let interimTranscript = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0]
                    .transcript;


                if (
                    event.results[i].isFinal
                ) {

                    finalTranscript +=
                        transcript + " ";

                }
                else {

                    interimTranscript +=
                        transcript;

                }

            }


            document.getElementById(
                "transcript"
            ).innerHTML =
                finalTranscript +
                "<span style='color:#888'>" +
                interimTranscript +
                "</span>";

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );

        };


    recognition.onend =
        function() {

            if (isRecording) {

                try {
                    recognition.start();
                }
                catch(e) {}

            }

        };


    try {

        recognition.start();

    }
    catch(e) {

        console.log(e);

    }

}


// =====================================================
// NEW STUDENT
// =====================================================

document.getElementById(
    "newStudentBtn"
)
.addEventListener(
    "click",
    function() {

        // Clear student information

        document.getElementById(
            "studentName"
        ).value = "";

        document.getElementById(
            "grade"
        ).value = "";

        document.getElementById(
            "section"
        ).value = "";

        document.getElementById(
            "language"
        ).value = "en-IN";


        // Clear transcript

        document.getElementById(
            "transcript"
        ).innerHTML =
            "Your spoken words will appear here...";


        // Hide audio player

        const audioPlayer =
            document.getElementById(
                "audioPlayer"
            );

        audioPlayer.pause();

        audioPlayer.src = "";

        audioPlayer.style.display = "none";


        // Hide buttons

        document.getElementById(
            "downloadBtn"
        ).style.display = "none";


        document.getElementById(
            "newStudentBtn"
        ).style.display = "none";


        // Hide student info

        document.getElementById(
            "studentInfo"
        ).style.display = "none";


        // Reset status

        document.getElementById(
            "status"
        ).innerHTML =
            "Ready for next student";


        document.getElementById(
            "status"
        ).classList.remove(
            "recording"
        );


        // Reset variables

        audioChunks = [];
        audioBlob = null;


        if (audioUrl) {

            URL.revokeObjectURL(
                audioUrl
            );

        }

        audioUrl = null;


        document.getElementById(
            "studentName"
        ).focus();

    }
);

</script>

</body>
</html>
